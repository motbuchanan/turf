<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="build" content="0.3.2">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#f1eee8;--dim:#a8a49c;--street:#16171b;--panel:#1f2126;--line:#34373e;--sodium:#f2a23a;--lav:#b9a3ff;--blue:#4f6bff;--brick:#8a3b2e;--ok:#5fd38a;--bad:#f0503a;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--street);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0}
.vilcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vlabs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vlab{position:absolute;left:0;top:0;pointer-events:none}
#fb{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}

/* layers over the map */
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.layer > *{pointer-events:auto}

/* title */
#title{background:linear-gradient(180deg,rgba(14,15,18,.2) 0%,rgba(14,15,18,0) 40%,rgba(14,15,18,.86) 78%)}
#title .mark{position:absolute;left:calc(20px + var(--safe-l));right:calc(20px + var(--safe-r));bottom:calc(150px + var(--safe-b));pointer-events:none}
#title .mark svg{width:min(72vw,300px);height:auto;display:block}
#title .mark p{margin-top:12px;font-size:clamp(15px,4.2vw,18px);color:var(--dim);max-width:36ch;line-height:1.4}
#title .go{position:absolute;left:calc(20px + var(--safe-l));bottom:calc(64px + var(--safe-b));min-width:200px;padding:16px 26px;background:var(--sodium);color:#1a1209;font-weight:800;font-size:18px;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14}
#title .go:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5d14}
#title .alt{position:absolute;left:calc(236px + var(--safe-l));bottom:calc(74px + var(--safe-b));padding:10px 4px;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* story card */
#story{background:rgba(10,10,12,.35)}
.card{position:absolute;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(16px + var(--safe-b));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;gap:14px;align-items:flex-start;max-width:560px;margin:0 auto}
.card .face{flex:0 0 96px;height:96px;border-radius:4px;overflow:hidden;border:2px solid var(--lav)}
.card .face[hidden]{display:none}
.card .face img{width:100%;height:100%;object-fit:cover;display:block}
.card .who{color:var(--lav);font-weight:800;font-size:15px;margin-bottom:4px}
.card .say{font-size:clamp(16px,4.4vw,19px);line-height:1.4}
.card .tap{display:block;margin-top:10px;color:var(--dim);font-size:13px}

/* attack HUD */
#hud .top{position:absolute;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));display:flex;align-items:center;gap:10px;pointer-events:none}
#hud .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px;min-width:72px;text-align:center}
#hud .score{display:flex;align-items:center;gap:6px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px}
#hud .score b{font-size:20px;font-variant-numeric:tabular-nums;min-width:3.2ch}
.stars{display:flex;gap:3px}
.stars i{width:20px;height:20px;display:block;background:#3a3c42;clip-path:polygon(50% 0,63% 36%,100% 38%,71% 61%,81% 100%,50% 78%,19% 100%,29% 61%,0 38%,37% 36%)}
.stars i.on{background:var(--sodium)}
#hud .end{margin-left:auto;pointer-events:auto;background:rgba(14,15,18,.78);border:1px solid var(--line);padding:9px 14px;border-radius:4px;font-weight:700}
#hud .end:active{background:#2a2c31}
#hud .tip{position:absolute;top:calc(92px + var(--safe-t));left:50%;transform:translateX(-50%);background:rgba(14,15,18,.85);padding:8px 14px;border-radius:4px;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#hud .bar{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:calc(10px + var(--safe-b));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.troop{position:relative;width:96px;height:112px;background:var(--panel);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 4px 6px}
.troop canvas{margin-bottom:2px}
.troop .nm{font-size:13px;font-weight:700}
.troop .n{position:absolute;top:4px;right:6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.troop.sel{border-color:var(--sodium);box-shadow:0 0 0 2px var(--sodium) inset}
.troop.out{opacity:.38}
.troop:active{transform:scale(.96)}
.bar.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
#result{background:rgba(10,10,12,.55)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 20px 18px}
.panel h2{font-size:26px;line-height:1.15;margin-bottom:8px}
.panel .stars{gap:8px;margin:12px 0 6px}
.panel .stars i{width:44px;height:44px}
.panel .pct{color:var(--dim);margin-bottom:16px}
.panel .acts{display:flex;flex-direction:column;gap:10px}
.btn{padding:14px 16px;border-radius:4px;font-weight:700;font-size:17px;background:#2c2e34;border:1px solid var(--line);text-align:left}
.btn.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14}
.btn:active{background:#3a3c42}
.btn.main:active{background:#d98c2a}

/* watch */
#watch .ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));display:flex;gap:8px;background:rgba(14,15,18,.85);padding:8px;border-radius:6px}
#watch .ctl button{min-width:64px;padding:12px 10px;border:1px solid var(--line);border-radius:4px;font-weight:700}
#watch .lbl{position:absolute;top:calc(12px + var(--safe-t));left:calc(12px + var(--safe-l));background:rgba(14,15,18,.8);padding:6px 10px;border-radius:4px;font-weight:700}

/* your block */
#home .res{position:absolute;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));right:calc(64px + var(--safe-r));display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.chip{display:flex;align-items:center;gap:7px;background:rgba(14,15,18,.82);padding:7px 10px;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;pointer-events:auto;min-height:44px}
.chip.full b{color:var(--sodium)}
.ic{display:block;width:20px;height:13px;border-radius:2px}
.ic.cash{background:#5fd38a;box-shadow:inset 0 0 0 2px #2d7a4b}
.ic.sup{width:16px;height:16px;background:#96764f;box-shadow:inset 0 0 0 2px #5c452a}
.ic.crew{width:14px;height:18px;border-radius:7px 7px 2px 2px;background:var(--lav)}
#home .dock{position:absolute;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));bottom:calc(14px + var(--safe-b));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;pointer-events:none}
#home.sheeton .dock{display:none}
.hb{pointer-events:auto;min-width:84px;min-height:52px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-weight:800;font-size:17px}
.hb.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14;min-width:112px}
.hb:active{transform:translateY(2px)}
#home .hint{position:absolute;top:calc(64px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(14,15,18,.92);border:1px solid var(--sodium);padding:6px 6px 6px 14px;border-radius:4px;font-size:15px;width:max-content;max-width:94vw}
#home .hint[hidden]{display:none}
#home .hint button{min-height:44px;padding:8px 14px;background:var(--sodium);color:#1a1209;font-weight:800;border-radius:3px}
.sheet{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:calc(8px + var(--safe-b));max-width:520px;margin:0 auto;max-height:58vh;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 4px 4px;padding:14px 14px 12px}
#sheetBody{overflow-y:auto;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.sheet .x{position:absolute;top:10px;right:10px;z-index:1;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:700;font-size:14px}
.sheet h3{font-size:20px;line-height:1.25;margin-bottom:6px;min-height:42px;padding-right:92px}
.sheet h3 span{color:var(--dim);font-size:14px;font-weight:600;margin-left:8px;white-space:nowrap}
.sheet p{color:var(--dim);font-size:15px;line-height:1.4;margin-bottom:8px}
.sheet p.stat{color:var(--ink)}
.sheet .btn{display:block;width:100%;margin:10px 0}
.btn.no{opacity:.45}
.rows{display:flex;flex-direction:column;gap:8px;clear:both}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#26282d;border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:60px}
.row .nm{font-weight:800;font-size:16px}
.row .sub{color:var(--dim);font-size:13px;line-height:1.3}
.row .mid{flex:1;min-width:0}
.row .pr{font-weight:800;font-size:13px;white-space:nowrap;text-align:right;line-height:1.35}
.row.no{opacity:.5}
.row canvas{flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px;clear:both}
.sw button{width:46px;height:46px;border-radius:4px 12px 4px 12px;border:2px solid var(--line)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.mini{flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:800;min-width:46px;min-height:46px;font-size:15px}
.mini:active,.row:active{background:#3a3c42}
@media (orientation:landscape) and (max-height:500px){.sheet{left:auto;margin:0;width:min(48vw,430px);max-height:calc(100vh - 16px - var(--safe-b))}}

/* always there */
#fsBtn{position:fixed;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:30;display:none;align-items:center;gap:8px;min-width:44px;min-height:44px;padding:10px 13px;background:rgba(14,15,18,.82);border:1px solid var(--line);border-radius:4px;font-weight:700;font-size:15px}
#title.on ~ #fsBtn:not([hidden]),#home.on ~ #fsBtn:not([hidden]){display:flex}
#home.on ~ #fsBtn span,#home.sheeton ~ #fsBtn:not([hidden]){display:none}
#fsBtn i{display:block;width:18px;height:18px;--c:var(--ink);background:linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) top/100% 2px no-repeat,linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) bottom/100% 2px no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) left/2px 100% no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) right/2px 100% no-repeat}
#fsBtn:active{background:#2a2c31}
#badge{position:fixed;right:calc(8px + var(--safe-r));bottom:calc(4px + var(--safe-b));font-size:11px;color:var(--dim);padding:6px;z-index:30;opacity:.8}
#story.on ~ #badge,#hud.on ~ #badge,#home.on ~ #badge{bottom:auto;top:calc(56px + var(--safe-t));right:auto;left:calc(8px + var(--safe-l))}
#title.on ~ #badge{min-height:44px;display:flex;align-items:flex-end}
#toast{position:fixed;left:50%;top:calc(110px + var(--safe-t));transform:translateX(-50%);background:#0e0f12;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:4px;font-size:15px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.act{pointer-events:auto;border-color:var(--sodium)}
#nogl{position:fixed;left:12px;right:12px;top:calc(12px + var(--safe-t));background:#2a1d14;border:1px solid #7a4a1c;padding:10px 12px;border-radius:4px;font-size:14px;display:none;z-index:35}
@media (prefers-reduced-motion:reduce){.bar.nudge{animation:none}}
#story{pointer-events:auto}
#hud .bar{pointer-events:none}
#hud .troop{pointer-events:auto}
@media (orientation:landscape) and (max-height:500px){
 .troop{width:84px;height:86px}.troop canvas{width:52px!important;height:52px!important}
 #hud .bar{left:auto;right:calc(8px + var(--safe-r));justify-content:flex-end}
 #title .mark{bottom:calc(96px + var(--safe-b))}#title .mark svg{width:min(40vw,240px)}#title .go{bottom:calc(20px + var(--safe-b))}#title .alt{bottom:calc(30px + var(--safe-b))}
 .card{max-width:640px}}

</style>
</head>
<body>
<div id="stage"><canvas id="fb"></canvas></div>

<div id="title" class="layer">
 <div class="mark"><h1 aria-label="Turf"></h1><p>One house on one block. Take the rest of it.</p></div>
 <button class="go" id="goBtn">Start</button>
 <button class="alt" id="watchBtn" hidden>Watch last fight</button>
</div>

<div id="story" class="layer">
 <div class="card" id="card"><div class="face" hidden><img id="faceImg" alt="The Viceroy" width="96" height="96"></div><div><div class="who">The Viceroy</div><div class="say"></div><span class="tap">Tap to continue</span></div></div>
</div>

<div id="hud" class="layer">
 <div class="top">
  <div class="clock" id="clock">3:00</div>
  <div class="score"><div class="stars" id="hudStars"><i></i><i></i><i></i></div><b id="pct">0%</b></div>
  <button class="end" id="endBtn">End</button>
 </div>
 <div class="tip" id="tip">Pick a troop, then tap the street</div>
 <div class="bar" id="bar"></div>
</div>

<div id="result" class="layer">
 <div class="panel"><h2 id="resTitle"></h2><div class="stars" id="resStars"><i></i><i></i><i></i></div><div class="pct" id="resPct"></div>
  <div class="acts"><button class="btn main" id="resNext"></button><button class="btn" id="resWatch">Watch the fight</button><button class="btn" id="resAgain">Run it again</button></div></div>
</div>

<div id="watch" class="layer">
 <div class="lbl" id="watchLbl">Replay</div>
 <div class="ctl"><button id="wPlay">Pause</button><button id="wSpeed">2x</button><button id="wSkip">Skip</button></div>
</div>

<div id="home" class="layer">
 <div class="res"><span class="chip"><i class="ic cash"></i><b id="hCash">0</b></span><span class="chip"><i class="ic sup"></i><b id="hSup">0</b></span><button class="chip" id="hCrew" aria-label="Your crew"><i class="ic crew"></i><b id="hArmy">0/0</b></button></div>
 <div class="hint" id="hHint" hidden><span id="hHintTxt"></span><button id="hHintDone">Done</button></div>
 <div class="dock"><button class="hb" id="hBuild">Build</button><button class="hb" id="hTrain">Crew</button><button class="hb main" id="hAttack">Attack</button></div>
 <div class="sheet" id="sheet" hidden><button class="x" id="sheetX">Close</button><div id="sheetBody"></div></div>
</div>

<div id="nogl"><span id="noglMsg">This phone can't draw the 3D block, so you're seeing the flat map. Everything still works.</span></div>
<button id="badge">v0.3.2 · Nov 20 2026</button>
<button id="fsBtn" hidden aria-label="Full screen"><i></i><span>Full screen</span></button>
<div id="toast"></div>

<script>
// base.js · the reusable base-building engine (grid, footprints, placement, wall joins, paths, seeded random).
// No game names live here: every game hands in its own building defs, unlock table and starter template.
// Ravenmarrow 3.0 · Nov 18 2026
const BASE = (() => {
'use strict';
const W = 28, H = 28;   // grid size in tiles

// seeded random: mulberry32. Every sim and every replay draws from this, never Math.random
function rng(seed){ let a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// defs: {kind: {fp:[w,h]}}; an item is {k, x, y}
function fpOf(defs, k){ const d = defs[k]; return d && d.fp ? d.fp : [1, 1]; }
function cells(defs, it){ const f = fpOf(defs, it.k), o = []; for (let y = 0; y < f[1]; y++) for (let x = 0; x < f[0]; x++) o.push([it.x + x, it.y + y]); return o; }
// the grid as an array of item indexes (-1 empty)
function grid(layout, defs, w, h){ w = w || W; h = h || H; const g = new Int16Array(w * h).fill(-1);
 (layout.items || []).forEach((it, i) => cells(defs, it).forEach(([x, y]) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = i; }));
 return {w, h, g, at(x, y){ return x < 0 || y < 0 || x >= w || y >= h ? -2 : g[y * w + x]; }}; }
// can this item sit here? (ignoring the item at index skip, the one being moved)
function fits(layout, it, defs, skip){ const gr = grid(layout, defs);
 return cells(defs, it).every(([x, y]) => { const v = gr.at(x, y); return v === -1 || (skip !== undefined && v === skip); }); }

// walls join to wall neighbours: bit 1 north, 2 east, 4 south, 8 west
function wallShape(layout, x, y){ const set = new Set((layout.items || []).filter(i => i.k === 'wall').map(i => i.x + ',' + i.y));
 return (set.has(x + ',' + (y - 1)) ? 1 : 0) | (set.has((x + 1) + ',' + y) ? 2 : 0) | (set.has(x + ',' + (y + 1)) ? 4 : 0) | (set.has((x - 1) + ',' + y) ? 8 : 0); }

// starter layout from a template the game supplies: {items:[{k,x,y}], ring:[x0,y0,x1,y1], gate:[[x,y],...]}
// counts: how many walls the unlock table allows. Anything that would overlap is dropped, never stacked
function starterLayout(defs, tpl, wallCount){
 const L = {v:1, items:[]};
 tpl.items.forEach(it => { const c = {k:it.k, x:it.x, y:it.y}; if (fits(L, c, defs)) L.items.push(c); });
 const [x0, y0, x1, y1] = tpl.ring, gate = new Set((tpl.gate || []).map(p => p[0] + ',' + p[1])), ring = [];
 for (let x = x0; x <= x1; x++){ ring.push([x, y0]); }
 for (let y = y0 + 1; y <= y1; y++){ ring.push([x1, y]); }
 for (let x = x1 - 1; x >= x0; x--){ ring.push([x, y1]); }
 for (let y = y1 - 1; y > y0; y--){ ring.push([x0, y]); }
 let n = 0; for (const [x, y] of ring){ if (n >= wallCount) break; if (gate.has(x + ',' + y)) continue; const c = {k:'wall', x, y}; if (fits(L, c, defs)){ L.items.push(c); n++; } }
 return L; }

// tile-centre of an item's footprint
function centre(defs, it){ const f = fpOf(defs, it.k); return [it.x + f[0] / 2, it.y + f[1] / 2]; }

// shortest walk on the tile grid (4 ways), passable(x, y) decides; the start and goal tiles are always allowed. Returns [[x,y],...] or null
function path(gr, from, to, passable){
 const w = gr.w, h = gr.h, key = (x, y) => y * w + x, prev = new Int32Array(w * h).fill(-1), seen = new Uint8Array(w * h);
 const ok = (x, y) => x >= 0 && y >= 0 && x < w && y < h && ((x === to[0] && y === to[1]) || passable(x, y));
 if (from[0] < 0 || from[1] < 0 || from[0] >= w || from[1] >= h) return null;
 const q = [from]; seen[key(from[0], from[1])] = 1;
 for (let qi = 0; qi < q.length; qi++){ const [x, y] = q[qi];
  if (x === to[0] && y === to[1]){ const out = []; let k = key(x, y); while (k !== -1){ out.push([k % w, Math.floor(k / w)]); k = prev[k]; } return out.reverse(); }
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const nx = x + dx, ny = y + dy; if (!ok(nx, ny) || seen[key(nx, ny)]) continue; seen[key(nx, ny)] = 1; prev[key(nx, ny)] = key(x, y); q.push([nx, ny]); } }
 return null; }

// can anything walk in from the edge of the map to touch this item? (raiders and villagers need a way in)
function reachable(layout, defs, it){

// the part of the yard your Main House level has not opened yet is left as a dark, empty lot
function homeTile(x, y){ const L = T.lotsOpen(T.houseLv(BLOCK));
 if (x >= 7 && x <= 21 && y >= 6 && y <= 20 && (x < L.x0 || x > L.x1 || y < L.y0 || y > L.y1)){ const r = ((x * 73856093) ^ (y * 19349663)) >>> 0; return r % 3 === 0 ? 23 : (r % 5 === 0 ? 15 : 1); }

const HANG = {house:2, gym:2, pad:1, hustle:1};   // how many of your people stand out front
function solidAt(x, y){ return BLOCK.some(i => { const f = T.BDEFS[i.k].fp; return x >= i.x && x < i.x + f[0] && y >= i.y && y < i.y + f[1]; }); }
function sceneFor(down){

  actors.push({route:[[p.x + post[0], p.y + post[1], post[2]]], faceAt:0, fig:fr => figFn(look, 0, 'work')}); });
 if (home) PARTS.forEach((p, i) => { for (let j = 0; j < (HANG[p.k] || 0); j++){ const x = p.x + .55 + j * .95, y = p.y + p.fh + .4; if (solidAt(Math.floor(x), Math.floor(y))) continue;
   const look = 'm|' + (300 + i * 7 + j) + '|' + MY_CREW + '|' + T.ORDER[(i + j) % 2]; actors.push({route:[[x, y, 0]], faceAt:0, fig:fr => figFn(look, fr, 'idle')}); } });

// ---------- flat fallback map (no WebGL2): top-down tiles, buildings and people ----------
const FB = (() => {

 function view(){ const s = Math.min(cv.width, cv.height) / 28, ox = (cv.width - s * 28) / 2, oy = (cv.height - s * 28) / 2; return {s, ox, oy}; }
 function draw(){
  if (!cv) return; const {s, ox, oy} = view(); cx.fillStyle = '#0e0f12'; cx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++){ cx.fillStyle = col((blockKind === 'home' ? homeTile : ART.tile)(x, y)); cx.fillRect(ox + x * s, oy + y * s, s + .5, s + .5); }
  if (zone && zoneT > 0){ cx.fillStyle = 'rgba(240,64,52,.35)'; zone.forEach(([x, y]) => cx.fillRect(ox + x * s, oy + y * s, s, s)); }
  PARTS.forEach((p, i) => { const dead = down && down[i]; cx.fillStyle = dead ? '#3a3633' : p.k === 'fence' ? '#9aa3a8' : p.k === 'porch' || p.k === 'roof' ? '#cca030' : p.k === 'house' ? '#8a3b2e' : p.k === 'gym' || p.k === 'stash' || p.k === 'supstash' ? '#8f8a80' : p.k === 'hustle' || p.k === 'run' ? '#2f8c8c' : '#6a3a30';
   const pad = p.k === 'fence' ? s * .3 : s * .08; cx.fillRect(ox + p.x * s + pad, oy + p.y * s + pad, p.fw * s - pad * 2, p.fh * s - pad * 2); });
  if (frame) frame.u.forEach(u => { if (!u[6]) return; const meta = units[u[0]] || {}; cx.fillStyle = meta.side === 'd' ? '#cca030' : '#b9a3ff'; cx.beginPath(); cx.arc(ox + u[1] * s, oy + u[2] * s, s * (meta.type === 'bruiser' ? .42 : .3), 0, 7); cx.fill(); });
  if (blockKind === 'enemy' && vicOn){ cx.fillStyle = viceroyFree ? '#b9a3ff' : '#6f60b0'; cx.fillRect(ox + 12 * s, oy + 15 * s, s * .7, s * .7); }
  if (blockKind === 'home'){ const q = PARTS.find(p => p.key === homeSel); if (q){ cx.strokeStyle = '#ffecaa'; cx.lineWidth = Math.max(2, s * .12); cx.strokeRect(ox + q.x * s, oy + q.y * s, q.fw * s, q.fh * s); } }
 }

 return {
  init(){ cv = $('fb'); cx = cv.getContext('2d'); size(); window.addEventListener('resize', size);
   cv.addEventListener('pointerup', e => { const r = cv.getBoundingClientRect(), d = cv.width / r.width, {s, ox, oy} = view(); onGround(((e.clientX - r.left) * d - ox) / s, ((e.clientY - r.top) * d - oy) / s); });
   loop(); },
  scene(d){ down = d; }, frame(f){ frame = f; }, flash(z){ zone = z; zoneT = 1.2; }
 };
})();

function meta(Rx){ const u = {}, base = (Rx.seed % 99991) * 37;

function buildBar(){

  b.innerHTML = `<span class="n">x${counts[k]}</span><span class="nm">${T.UNITS[k].name}</span>`; b.insertBefore(miniIcon(iconLook(k), 74), b.lastChild);
  b.onclick = e => { e.stopPropagation(); if (!counts[k]) return; sel = k; refreshBar(); }; bar.appendChild(b); });

}
function refreshBar(){ $('bar').querySelectorAll('.troop').forEach(b => { const k = b.dataset.k; b.classList.toggle('sel', k === sel); b.classList.toggle('out', !counts[k]); b.querySelector('.n').textContent = 'x' + counts[k]; }); }
function startAttack(recipe){
 R = recipe; setBlock(T.RESCUE_BLOCK, 'enemy'); vicOn = R.mode === 'rescue'; if (gl3d) VIL.edit(null);
 sim = B.raidStart(R, {record:true}); finished = false; coreAt = 0; queued = {}; acc = 0; lastT = 0; viceroyFree = false; lastDown = 'x';

function run(now){

 const dt = Math.min(.25, (now - (lastT || now)) / 1000); lastT = now; acc += dt;   // rAF pauses with the screen off, so a locked phone pauses the fight

function afterTick(){

 let lost = 0, total = 0; items.forEach((b, i) => { if (!b.max) return; total += b.max; lost += b.max - Math.max(0, f.b[i]); });
 const pct = Math.round(100 * lost / (total || 1)), coreI = R.items.findIndex(b => b.role === 'core'), coreDown = f.b[coreI] <= 0;
 $('pct').textContent = pct + '%'; setStars($('hudStars'), (pct >= 50 ? 1 : 0) + (coreDown ? 1 : 0) + (pct >= 100 ? 1 : 0));

function clock(t){ const left = Math.max(0, Math.ceil((R ? R.maxT : 1800) / 10 - t / 10)); return Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); }

}
$('endBtn').onclick = e => { e.stopPropagation(); if (sim && !finished) sim.end(); };
function finish(){

  R.attackers.forEach((a, j) => { if (queued[j] || sim.placed(j)) save.army[a.type] = Math.max(0, (save.army[a.type] | 0) - 1); });

 const onTick = i => { const f = wFrames[i], down = items.map((b, j) => f.b[j] <= 0), coreI = Rw.items.findIndex(b => b.role === 'core');
  if (vicOn && f.b[coreI] <= 0 && !viceroyFree){ viceroyFree = true; lastDown = 'x'; } paint(down); };

 else { wI = 0; cancelAnimationFrame(wRaf); let a = 0, lt = 0; const step = now => { wRaf = requestAnimationFrame(step); const dt = Math.min(.25, (now - (lt || now)) / 1000); lt = now; if (wPaused) return; a += dt * wSpeed;

function fenceAt(x, y, add){

  if (!T.fitsAt(b, null, 'fence', x, y)) return;
  if (T.count(b, 'fence') >= T.capFor('fence', T.houseLv(b))){ toast('No more fence at this house level'); return; }
  if (!has(c)){ toast('Fence costs ' + costText(c) + ' a piece'); return; }
  b.push({key:'f' + x + '_' + y, k:'fence', x, y, lv:1});
  if (!T.reachOk(b)){ b.pop(); toast('That would wall something in'); return; }
  pay(c); }
 else { if (i < 0) return; b.splice(i, 1); addRes(0, T.HOME.fence.cost[1]); }
 saveGame(); homePaint();
}
function buy(k){
 const b = save.block, c = T.HOME[k].cost, lv = T.houseLv(b);
 if (T.count(b, k) >= T.capFor(k, lv)){ toast(T.capFor(k, lv) ? 'Level up the Main House for more' : 'Opens at Main House level 2'); return; }
 if (!has(c)){ toast('Needs ' + costText(c)); return; }
 const spot = T.freeSpot(b, k); if (!spot){ toast('No room on the lot. Move things or level up the Main House.'); return; }
 const it = {key:'b' + (save.nk++), k, x:spot[0], y:spot[1], lv:1}; b.push(it);
 if (!T.reachOk(b)){ b.pop(); toast('No spot that leaves a way in. Move a fence first.'); return; }
 pay(c); saveGame(); homeSel = it.key; homePaint(); openSheet('info'); focusOn(it.x + 1, it.y + 1);
 toast(gl3d ? 'Placed. Drag it where you want it.' : 'Placed. Tap an open spot to move it.', 2400);
}
function levelUp(key){
 const it = item(key); if (!it) return; const c = T.upgradeCost(it.k, it.lv); if (!c) return;
 if (!has(c)){ toast('Needs ' + costText(c)); return; }
 pay(c); it.lv++; saveGame(); homePaint(); openSheet('info');
 if (it.k === 'house'){ cam('home'); toast('The lot got bigger. New limits on everything.', 2600); } else toast(T.BDEFS[it.k].name + ' is level ' + it.lv);
}
function train(k, n){
 const a = save.army;
 if (n < 0){ if (a[k] > 0){ a[k]--; saveGame(); } }
 else {
  if (T.gymLv(save.block) < T.UNLOCKS[k]){ toast('Level the Gym to ' + T.UNLOCKS[k] + ' first'); return; }
  if (T.armySize(a) + T.SIZE[k] > T.armyCap(save.block)){ toast('No beds left. Level up the Crash Pad.'); return; }
  const c = [T.trainCost(k), 0]; if (!has(c)){ toast('Needs ' + costText(c)); return; }
  pay(c); a[k]++; saveGame(); }
 homeHud(); openSheet('crew');
}
function setColor(c){ if (!MINI.GANGS[c] || c === 'gold') return; save.color = MY_CREW = c; saveGame(); homePaint(); openSheet('crew'); }
function statLine(it){
 const k = it.k, lv = it.lv, b = save.block;
 if (k === 'house'){ const L = T.lotsOpen(lv), n = L.x1 - L.x0 + 1; return 'Your lot is ' + n + ' by ' + n + '.' + (lv < T.maxLv(k) ? ' The next level opens ' + (n + 2) + ' by ' + (n + 2) + '.' : ''); }
 if (k === 'hustle') return 'Pays ' + 60 * lv + ' Cash after every fight.';
 if (k === 'run') return 'Brings ' + 40 * lv + ' Supplies after every fight.';
 if (k === 'stash') return 'Holds ' + 1500 * lv + ' Cash. You can hold ' + T.storeCap(b).cash + ' in all.';
 if (k === 'supstash') return 'Holds ' + 1500 * lv + ' Supplies. You can hold ' + T.storeCap(b).sup + ' in all.';
 if (k === 'pad') return 'Sleeps ' + (14 + 6 * lv) + '.';
 if (k === 'gym') return 'Trains ' + T.ORDER.filter(u => T.UNLOCKS[u] <= lv).map(u => T.UNITS[u].name + 's').join(', ') + '.';
 if (k === 'porch' || k === 'roof') return 'Reaches ' + T.BDEFS[k].range + ' tiles. Guards the block once rivals can hit back.';
 if (k === 'fence') return T.count(b, 'fence') + ' of ' + T.capFor('fence', T.houseLv(b)) + ' pieces up.';
 return '';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
function openSheet(kind){
 const body = $('sheetBody'); let h = ''; sheetKind = kind;
 if (kind === 'info'){ const it = item(homeSel); if (!it){ closeSheet(); return; } const d = T.BDEFS[it.k], c = T.upgradeCost(it.k, it.lv);
  h = '<h3>' + esc(d.name) + (it.k === 'fence' ? '' : '<span>Level ' + it.lv + '</span>') + '</h3><p>' + esc(T.HOME[it.k].line) + '</p><p class="stat">' + esc(statLine(it)) + '</p>';
  if (it.k === 'fence') h += '<button class="btn" data-act="unfence">Take it down, ' + T.HOME.fence.cost[1] + ' Supplies back</button>';
  else { h += c ? '<button class="btn main' + (has(c) ? '' : ' no') + '" data-act="up">Level up for ' + costText(c) + '</button>' : '<p class="stat">Top level.</p>';
   h += '<p>' + (gl3d ? 'Drag it to move it.' : 'Tap an open spot to move it there.') + '</p>'; } }
 else if (kind === 'shop'){ const b = save.block, lv = T.houseLv(b);
  h = '<h3>Build</h3><div class="rows">';
  const fn = T.count(b, 'fence'), fc = T.capFor('fence', lv);
  h += '<div class="row"><span class="mid"><span class="nm">Chain-link Fence</span><br><span class="sub">' + fn + ' of ' + fc + ' up. ' + T.HOME.fence.cost[1] + ' Supplies a piece.</span></span><button class="mini" data-act="lay">Lay</button><button class="mini" data-act="pull">Take down</button></div>';

  T.SHOP.forEach(k => { const n = T.count(b, k), cap = T.capFor(k, lv), c = T.HOME[k].cost, off = n >= cap || !has(c);
   h += '<button class="row' + (off ? ' no' : '') + '" data-buy="' + k + '"><span class="mid"><span class="nm">' + esc(T.BDEFS[k].name) + '</span><br><span class="sub">' + esc(T.HOME[k].line) + '</span></span><span class="pr">' + (cap ? n + ' of ' + cap + '<br>' + costText(c) : 'House level 2') + '</span></button>'; });
  h += '</div>'; }
 else if (kind === 'crew'){ const a = save.army, g = T.gymLv(save.block);
  h = '<h3>Your crew<span>' + T.armySize(a) + ' of ' + T.armyCap(save.block) + ' beds</span></h3><p>Colors are the only thing that marks your people.</p><div class="sw">';
  GANG_PICK.forEach(c => { h += '<button data-col="' + c + '" class="' + (c === MY_CREW ? 'on' : '') + '" style="background:' + gangHex(c) + '" aria-label="' + c + '"></button>'; });
  h += '</div><div class="rows">';
  T.ORDER.forEach(k => { const u = T.UNITS[k], open = g >= T.UNLOCKS[k];
   h += '<div class="row' + (open ? '' : ' no') + '" data-unit="' + k + '"><span class="mid"><span class="nm">' + esc(u.name) + ' x' + (a[k] || 0) + '</span><br><span class="sub">' + (open ? esc(u.line) + ' ' + T.SIZE[k] + (T.SIZE[k] === 1 ? ' bed.' : ' beds.') : 'Comes in at Gym level ' + T.UNLOCKS[k] + '.') + '</span></span>'
    + (open ? '<button class="mini" data-train="' + k + '" data-n="-1" aria-label="Let one ' + esc(u.name) + ' go">-</button><button class="mini" data-train="' + k + '" data-n="1">+ ' + T.trainCost(k) + '</button>' : '') + '</div>'; });
  h += '</div>'; }
 body.innerHTML = h;
 if (kind === 'crew') body.querySelectorAll('[data-unit]').forEach(r => r.insertBefore(miniIcon(iconLook(r.dataset.unit), 64), r.firstChild));
 $('sheet').hidden = false; $('home').classList.add('sheeton');
}
function closeSheet(){ sheetKind = null; $('sheet').hidden = true; $('home').classList.remove('sheeton'); }
$('sheetX').onclick = () => { const was = sheetKind; closeSheet(); if (was === 'info'){ homeSel = null; if (gl3d) VIL.select(null); else FB.scene(null); } };
$('sheetBody').addEventListener('click', e => {
 const t = e.target.closest('[data-buy],[data-act],[data-train],[data-col]'); if (!t) return;
 if (t.dataset.buy) buy(t.dataset.buy);
 else if (t.dataset.train) train(t.dataset.train, +t.dataset.n);
 else if (t.dataset.col) setColor(t.dataset.col);
 else if (t.dataset.act === 'up') levelUp(homeSel);
 else if (t.dataset.act === 'unfence'){ const it = item(homeSel); if (it){ homeSel = null; closeSheet(); fenceAt(it.x, it.y, false); } }
 else if (t.dataset.act === 'lay' || t.dataset.act === 'pull'){ fenceMode = t.dataset.act === 'lay' ? 'paint' : 'erase'; homeSel = null; closeSheet(); setEdit(); homeHud();
  if (gl3d) toast('Two fingers move the map while you work on fence', 2600); }
});
$('hHintDone').onclick = () => { fenceMode = null; setEdit(); homeHud(); };
$('hBuild').onclick = () => openSheet('shop');
$('hTrain').onclick = $('hCrew').onclick = () => openSheet('crew');
$('hAttack').onclick = () => { if (!T.armySize(save.army)){ toast('Train a crew first'); openSheet('crew'); return; } startAttack(T.raidRecipe(seed(), save.army)); };
// the flat map has no dragging: tap a building to pick it, then tap an open spot to move it there
function homeGround(gx, gy){
 const x = Math.floor(gx), y = Math.floor(gy);
 if (fenceMode){ fenceAt(x, y, fenceMode === 'paint'); return; }
 const p = PARTS.find(q => x >= q.x && x < q.x + q.fw && y >= q.y && y < q.y + q.fh);
 if (p){ selectItem(p.key); FB.scene(null); return; }
 const it = item(homeSel); if (it && T.fitsAt(save.block, it.key, it.k, x, y)){ moveTo(it.key, x, y); return; }
 selectItem(null);
}
// slide the camera so a spot on the lot sits clear of the sheet
function focusOn(x, y){ if (!gl3d) return; const v = VIL.view(), r = $('stage').getBoundingClientRect(), tall = r.width < r.height;
 const p = VIL.project(x, y, 0), a = VIL.project(x + 1, y, 0), b = VIL.project(x, y + 1, 0); if (!p || !a || !b) return;
 const ex = p[0] - (tall ? r.width * .5 : r.width * .27), ey = p[1] - (tall ? r.height * .36 : r.height * .5);
 const j11 = a[0] - p[0], j21 = a[1] - p[1], j12 = b[0] - p[0], j22 = b[1] - p[1], det = j11 * j22 - j12 * j21; if (!det) return;
 VIL.view({tx:v.tx + (j22 * ex - j12 * ey) / det, ty:v.ty + (-j21 * ex + j11 * ey) / det, zoom:v.zoom}); }
function toHome(){
 if (!save.block){ save.block = T.starterBlock(); save.cash = T.START.cash; save.sup = T.START.sup; save.army = Object.assign({}, T.START.army); save.nk = 20; saveGame(); firstHome = true; }
 if (gl3d) VIL.battle(null); homeSel = null; fenceMode = null; closeSheet(); show('home'); homePaint(); setEdit(); cam('home');
 if (firstHome){ firstHome = false; openSheet('crew'); }
}

// ---------- updates: a new build on the server prompts a reload ----------
function checkUpdate(){
 fetch('sw.js', {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/turf-v([\d.]+)/); if (m && m[1] !== VER){ toast('New version ' + m[1] + ', tap to reload', 12000, () => location.reload()); if ('serviceWorker' in navigator) swUpdate(); } }).catch(() => {});
}
function bust(){
 // the version buster: if the page on the server is newer than this copy, load it once
 try { if (sessionStorage.getItem('turf.bust') === VER) return; } catch (e){}
 fetch(location.pathname, {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/<meta name="build" content="([^"]+)"/);
  if (m && m[1] !== VER){ try { sessionStorage.setItem('turf.bust', VER); } catch (e){} location.replace(location.pathname + '?v=' + m[1]); } }).catch(() => {});
}
// ask the browser to look for a newer service worker now, not whenever it gets around to it
function swUpdate(){ try { navigator.serviceWorker.getRegistration().then(r => { if (r) r.update().catch(() => {}); }).catch(() => {}); } catch (e){} }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').then(swUpdate).catch(() => {});
if (location.protocol.startsWith('http')){ bust(); checkUpdate(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); }); }

// ---------- go ----------
mountMap(); toTitle();
// test hook (used by the headless proof): read-only peeks at the fight
window.TURF_TEST = {block:() => JSON.parse(JSON.stringify(save.block)), home:() => ({cash:save.cash, sup:save.sup, army:Object.assign({}, save.army), sel:homeSel, sheet:sheetKind, fence:fenceMode, color:MY_CREW, lv:save.block ? T.houseLv(save.block) : 0, n:save.block ? save.block.length : 0}),
 state:() => ({screen:['title', 'story', 'hud', 'result', 'watch', 'home'].find(k => $(k).classList.contains('on')), tick:sim ? sim.tick() : 0, counts:Object.assign({}, counts), sel, finished, gl3d, reports:save.reports.length}),
 toScreen:(x, y, z) => gl3d ? VIL.project(x, y, z || 0) : null, result:() => sim ? sim.result() : null};
})();

</script>
