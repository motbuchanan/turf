<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="build" content="0.5.2">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#f1eee8;--dim:#a8a49c;--street:#16171b;--panel:#1f2126;--line:#34373e;--sodium:#f2a23a;--lav:#b9a3ff;--blue:#4f6bff;--brick:#8a3b2e;--ok:#5fd38a;--bad:#f0503a;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--street);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0}
.vilcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vlabs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vlab{position:absolute;left:0;top:0;pointer-events:none}
#fb{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}

/* layers over the map */
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.layer > *{pointer-events:auto}

/* title */
#title{background:linear-gradient(180deg,rgba(14,15,18,.2) 0%,rgba(14,15,18,0) 40%,rgba(14,15,18,.86) 78%)}
/* painted pictures behind the title and the Viceroy's story cards; if one fails to load it hides and the 3D block shows instead */
.layer > .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.layer > .pic[hidden],.layer > .pic[hidden] + .shade{display:none}
.layer > .shade{position:absolute;inset:0;pointer-events:none}
#titlePic{object-position:50% 55%}
#title .shade{background:linear-gradient(180deg,rgba(14,15,18,.1) 0%,rgba(14,15,18,0) 45%,rgba(14,15,18,.9) 82%)}
#story .shade{background:linear-gradient(180deg,rgba(10,10,12,0) 45%,rgba(10,10,12,.75) 100%)}
#title .mark{position:absolute;left:calc(20px + var(--safe-l));right:calc(20px + var(--safe-r));bottom:calc(150px + var(--safe-b));pointer-events:none}
#title .mark svg{width:min(72vw,300px);height:auto;display:block}
#title .mark h1.painted img{display:block;width:auto;height:auto;max-width:min(80vw,360px);max-height:34vh;margin-left:-8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
#title .mark p{margin-top:12px;font-size:clamp(15px,4.2vw,18px);color:var(--dim);max-width:36ch;line-height:1.4}
#title .go{position:absolute;left:calc(20px + var(--safe-l));bottom:calc(64px + var(--safe-b));min-width:200px;padding:16px 26px;background:var(--sodium);color:#1a1209;font-weight:800;font-size:18px;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14}
#title .go:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5d14}
#title .alt{position:absolute;left:calc(236px + var(--safe-l));bottom:calc(74px + var(--safe-b));padding:10px 4px;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* story card */
#story{background:rgba(10,10,12,.35)}
.card{position:absolute;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(16px + var(--safe-b));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;gap:14px;align-items:flex-start;max-width:560px;margin:0 auto}
.card .face{flex:0 0 96px;height:96px;border-radius:4px;overflow:hidden;border:2px solid var(--lav)}
.card .face[hidden]{display:none}
.card .face img{width:100%;height:100%;object-fit:cover;display:block}
.card .who{color:var(--lav);font-weight:800;font-size:15px;margin-bottom:4px}
.card .say{font-size:clamp(16px,4.4vw,19px);line-height:1.4}
.card .tap{display:block;margin-top:10px;color:var(--dim);font-size:13px}

/* attack HUD */
#hud .top{position:absolute;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));display:flex;align-items:center;gap:10px;pointer-events:none}
#hud .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px;min-width:72px;text-align:center}
#hud .score{display:flex;align-items:center;gap:6px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px}
#hud .score b{font-size:20px;font-variant-numeric:tabular-nums;min-width:3.2ch}
.stars{display:flex;gap:3px}
.stars i{width:20px;height:20px;display:block;background:#3a3c42;clip-path:polygon(50% 0,63% 36%,100% 38%,71% 61%,81% 100%,50% 78%,19% 100%,29% 61%,0 38%,37% 36%)}
.stars i.on{background:var(--sodium)}
#hud .end{margin-left:auto;pointer-events:auto;background:rgba(14,15,18,.78);border:1px solid var(--line);padding:9px 14px;border-radius:4px;font-weight:700}
#hud .end:active{background:#2a2c31}
#hud .tip{position:absolute;top:calc(92px + var(--safe-t));left:50%;transform:translateX(-50%);background:rgba(14,15,18,.85);padding:8px 14px;border-radius:4px;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#hud .bar{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px - var(--safe-l) - var(--safe-r));bottom:calc(10px + var(--safe-b));display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain;touch-action:pan-x;scrollbar-width:none}
#hud .bar::-webkit-scrollbar{display:none}
#hud .bar .troop{flex:0 0 auto}
.troop{position:relative;width:96px;height:112px;background:var(--panel);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 4px 6px}
.troop canvas{margin-bottom:2px}
.troop .nm{font-size:13px;font-weight:700}
.troop .n{position:absolute;top:4px;right:6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.troop.sel{border-color:var(--sodium);box-shadow:0 0 0 2px var(--sodium) inset}
.troop.out{opacity:.38}
.troop:active{transform:scale(.96)}
.bar.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
#result{background:rgba(10,10,12,.55)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 20px 18px}
.panel h2{font-size:26px;line-height:1.15;margin-bottom:8px}
.panel .stars{gap:8px;margin:12px 0 6px}
.panel .stars i{width:44px;height:44px}
.panel .pct{color:var(--dim);margin-bottom:16px}
.panel .acts{display:flex;flex-direction:column;gap:10px}
.btn{padding:14px 16px;border-radius:4px;font-weight:700;font-size:17px;background:#2c2e34;border:1px solid var(--line);text-align:left}
.btn.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14}
.btn:active{background:#3a3c42}
.btn.main:active{background:#d98c2a}

/* watch */
#watch .ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));display:flex;gap:8px;background:rgba(14,15,18,.85);padding:8px;border-radius:6px}
#watch .ctl button{min-width:64px;padding:12px 10px;border:1px solid var(--line);border-radius:4px;font-weight:700}
#watch .lbl{position:absolute;top:calc(12px + var(--safe-t));left:calc(12px + var(--safe-l));background:rgba(14,15,18,.8);padding:6px 10px;border-radius:4px;font-weight:700}

/* your block */
#home .res{position:absolute;top:calc(10px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(62px + var(--safe-r));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(14,15,18,.82);padding:6px 8px;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(14px,3.9vw,17px);pointer-events:auto;min-height:44px}
.chip.full b{color:var(--sodium)}
.ic{display:block;width:20px;height:13px;border-radius:2px}
.ic.cash{background:#5fd38a;box-shadow:inset 0 0 0 2px #2d7a4b}
.ic.sup{width:16px;height:16px;background:#96764f;box-shadow:inset 0 0 0 2px #5c452a}
.ic.rep{width:16px;height:16px;border-radius:50%;background:var(--sodium);box-shadow:inset 0 0 0 3px #9a5d14}
.ic.crew{width:14px;height:18px;border-radius:7px 7px 2px 2px;background:var(--lav)}
#home .dock{position:absolute;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));bottom:calc(14px + var(--safe-b));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;pointer-events:none}
#home.sheeton .dock{display:none}
.hb{pointer-events:auto;min-width:84px;min-height:52px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-weight:800;font-size:17px}
.hb.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14;min-width:112px}
.hb:active{transform:translateY(2px)}
#home .hint{position:absolute;top:calc(64px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(14,15,18,.92);border:1px solid var(--sodium);padding:6px 6px 6px 14px;border-radius:4px;font-size:15px;width:max-content;max-width:94vw}
#home .hint[hidden]{display:none}
#home .hint button{min-height:44px;padding:8px 14px;background:var(--sodium);color:#1a1209;font-weight:800;border-radius:3px}
.sheet{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:calc(8px + var(--safe-b));max-width:520px;margin:0 auto;max-height:58vh;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 4px 4px;padding:62px 14px 12px}
#sheetBody{overflow-y:auto;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.sheet .x{position:absolute;top:10px;right:10px;z-index:1;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:700;font-size:14px}
.sheet h3{font-size:20px;line-height:1.25;margin-bottom:6px}
.sheet .x{left:14px;right:auto}
.sheet h3 span{color:var(--dim);font-size:14px;font-weight:600;margin-left:8px;white-space:nowrap}
.sheet p{color:var(--dim);font-size:15px;line-height:1.4;margin-bottom:8px}
.sheet p.stat{color:var(--ink)}
.sheet .btn{display:block;width:100%;margin:10px 0}
.btn.no{opacity:.45}
.rows{display:flex;flex-direction:column;gap:8px;clear:both}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#26282d;border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:60px}
.row .nm{font-weight:800;font-size:16px}
.row .sub{color:var(--dim);font-size:13px;line-height:1.3}
.row .mid{flex:1;min-width:0}
.row .pr{font-weight:800;font-size:13px;white-space:nowrap;text-align:right;line-height:1.35}
.row.no{opacity:.5}
.row canvas{flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px;clear:both}
.sw button{width:46px;height:46px;border-radius:4px 12px 4px 12px;border:2px solid var(--line)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.mini{flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:800;min-width:46px;min-height:46px;font-size:15px}
.mini:active,.row:active{background:#3a3c42}
@media (orientation:landscape) and (max-height:500px){.sheet{left:auto;margin:0;width:min(48vw,430px);max-height:calc(100vh - 16px - var(--safe-b))}}

/* always there */
#fsBtn{position:fixed;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:30;display:none;align-items:center;gap:8px;min-width:44px;min-height:44px;padding:10px 13px;background:rgba(14,15,18,.82);border:1px solid var(--line);border-radius:4px;font-weight:700;font-size:15px}
#title.on ~ #fsBtn:not([hidden]),#home.on ~ #fsBtn:not([hidden]){display:flex}
#home.on ~ #fsBtn span,#home.sheeton ~ #fsBtn:not([hidden]){display:none}
#fsBtn i{display:block;width:18px;height:18px;--c:var(--ink);background:linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) top/100% 2px no-repeat,linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) bottom/100% 2px no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) left/2px 100% no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) right/2px 100% no-repeat}
#fsBtn:active{background:#2a2c31}
#badge{position:fixed;right:calc(8px + var(--safe-r));bottom:calc(4px + var(--safe-b));font-size:11px;color:var(--dim);padding:6px;z-index:30;opacity:.8}
#story.on ~ #badge,#hud.on ~ #badge,#home.on ~ #badge{bottom:auto;top:calc(56px + var(--safe-t));right:auto;left:calc(8px + var(--safe-l))}
#title.on ~ #badge{min-height:44px;display:flex;align-items:flex-end}
#toast{position:fixed;left:50%;top:calc(110px + var(--safe-t));transform:translateX(-50%);background:#0e0f12;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:4px;font-size:15px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.act{pointer-events:auto;border-color:var(--sodium)}
#nogl{position:fixed;left:12px;right:12px;top:calc(12px + var(--safe-t));background:#2a1d14;border:1px solid #7a4a1c;padding:10px 12px;border-radius:4px;font-size:14px;display:none;z-index:35}
@media (prefers-reduced-motion:reduce){.bar.nudge{animation:none}}
#story{pointer-events:auto}
#hud .bar{pointer-events:none}
#hud .troop{pointer-events:auto}
@media (orientation:landscape) and (max-height:500px){
 .troop{width:84px;height:86px}.troop canvas{width:52px!important;height:52px!important}
 #hud .bar{left:auto;transform:none;right:calc(8px + var(--safe-r));max-width:calc(100% - 140px - var(--safe-l) - var(--safe-r))}
 #title .mark{bottom:calc(96px + var(--safe-b))}#title .mark svg{width:min(40vw,240px)}#title .go{bottom:calc(20px + var(--safe-b))}#title .alt{bottom:calc(30px + var(--safe-b))}#title.layer #introBtn{left:calc(384px + var(--safe-l));bottom:calc(30px + var(--safe-b))}
 .card{max-width:640px}}
.tod{display:flex;gap:0;margin:4px 0 6px}
.tod button{flex:1;min-height:46px;border:1px solid var(--line);background:#26282d;font-weight:800;font-size:15px;color:var(--dim)}
.tod button:first-child{border-radius:4px 0 0 4px}.tod button:last-child{border-radius:0 4px 4px 0}
.tod button.on{background:#e8d9a8;color:#1b1b1d;border-color:#e8d9a8}
.crewhd{display:flex;align-items:center;gap:10px;margin-top:10px}
.crewhd i{flex:0 0 auto;width:14px;height:40px;border-radius:2px}
.crewhd .nm{font-weight:800;font-size:16px}.crewhd .sub{color:var(--dim);font-size:13px;line-height:1.3}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.blk{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:76px;padding:8px 4px;border:1px solid var(--line);border-radius:6px 2px 6px 2px;background:#26282d}
.blk .nm{font-weight:800;font-size:13px;text-align:center;line-height:1.15}
.blk .sub{color:var(--dim);font-size:11px;text-align:center;line-height:1.2}
.blk .st{display:flex;gap:2px}.blk .st i{width:11px;height:11px;background:#44464c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.blk .st i.on{background:#f0c64a}
.blk.no{opacity:.45}.blk:active{background:#3a3c42}
@media (max-width:360px){.blocks{grid-template-columns:repeat(2,1fr)}}
#sheetBody h4{margin:16px 0 2px;font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:8px}
#sheetBody h4 span{color:var(--dim);font-weight:600;font-size:14px}
.troop.boss{border-color:#6b6f78}
.troop.ready{border-color:#f0c64a;box-shadow:0 0 0 2px #f0c64a inset;animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 4px #f0c64a inset}}
.troop.item .nm{font-size:12px;line-height:1.1;text-align:center}
.troop.boss .nm{font-size:12px;line-height:1.1;text-align:center}
@media (prefers-reduced-motion:reduce){.troop.ready{animation:none}}
.troop.out:not(.boss){display:none}
#title #introBtn{position:absolute;left:calc(20px + var(--safe-l));bottom:calc(18px + var(--safe-b));padding:10px 4px;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px;background:none;border:0}
#intro{position:fixed;inset:0;z-index:40;background:#0b0c0f;overflow:hidden}
#intro[hidden]{display:none}
#introBg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(22px) brightness(.45);pointer-events:none}
#introFrame{position:absolute;inset:0;pointer-events:none}
#introPic,#introVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#introPic[hidden],#introVid[hidden]{display:none}
#introPic.push{animation:introPush 6.4s linear both}
@keyframes introPush{from{transform:scale(1)}to{transform:scale(1.07)}}
#intro::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(11,12,15,0),rgba(11,12,15,.88) 70%);pointer-events:none}
#introCap{position:absolute;z-index:1;left:calc(22px + var(--safe-l));right:calc(22px + var(--safe-r));bottom:calc(78px + var(--safe-b));font-size:clamp(19px,5.2vw,28px);font-weight:800;line-height:1.25;color:#f3ead2;max-width:24ch;text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0}
#introCap.in{animation:introCap .7s .35s ease-out both}
@keyframes introCap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#introPips{position:absolute;z-index:1;left:calc(22px + var(--safe-l));bottom:calc(40px + var(--safe-b));display:flex;gap:6px}
#introPips i{width:26px;height:4px;background:rgba(255,255,255,.22)}
#introPips i.done{background:#e0b64a}#introPips i.now{background:linear-gradient(90deg,#e0b64a 50%,rgba(255,255,255,.22) 50%);background-size:200% 100%;animation:introPip 6s linear both}
@keyframes introPip{from{background-position:100% 0}to{background-position:0 0}}
#introSkip{position:absolute;z-index:1;right:calc(16px + var(--safe-r));bottom:calc(22px + var(--safe-b));min-width:72px;min-height:44px;padding:10px 16px;font-weight:800;font-size:15px;color:#f3ead2;background:rgba(11,12,15,.6);border:1px solid rgba(255,255,255,.3);border-radius:4px}
#introSkip:active{background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){#introPic.push,#introCap.in,#introPips i.now{animation:none}#introCap{opacity:1}}

</style>
</head>
<body>
<div id="stage"><canvas id="fb"></canvas></div>

<div id="title" class="layer">
 <img class="pic" id="titlePic" alt="" src="title.jpg"><div class="shade"></div>
 <div class="mark"><h1 aria-label="Turf"></h1><p>One house on one block. Take the rest of it.</p></div>
 <button class="go" id="goBtn">Start</button>
 <button class="alt" id="watchBtn" hidden>Watch last fight</button>
 <button class="alt" id="introBtn" hidden>Play the intro</button>
</div>

<div id="intro" hidden>
 <img id="introBg" alt=""><div id="introFrame"><img id="introPic" alt=""><video id="introVid" muted playsinline preload="none"></video></div>
 <p id="introCap"></p><div id="introPips"></div>
 <button id="introSkip">Skip</button>
</div>

<div id="story" class="layer">
 <img class="pic" id="storyPic" alt="" hidden><div class="shade"></div>
 <div class="card" id="card"><div class="face" hidden><img id="faceImg" alt="The Viceroy" width="96" height="96"></div><div><div class="who">The Viceroy</div><div class="say"></div><span class="tap">Tap to continue</span></div></div>
</div>

<div id="hud" class="layer">

function fenceRing(x0, y0, x1, y1, gaps){
 const out = [], skip = new Set(gaps.map(g => g.join(',')));
 for (let x = x0; x <= x1; x++){ out.push([x, y0]); out.push([x, y1]); }
 for (let y = y0 + 1; y < y1; y++){ out.push([x0, y]); out.push([x1, y]); }
 return out.filter(p => !skip.has(p.join(',')));
}

const FENCE_HP = [240, 480, 900, 1500], FENCE_NAMES = ['Chain-link Fence', 'Wood Fence', 'Brick Wall', 'Steel Fence'];
function fightItem(it){
 const d = BDEFS[it.k], f = d.fp, lv = Math.max(1, it.lv | 0), m = 1 + .2 * (lv - 1);
 const out = {key:it.key, k:it.k, x:it.x, y:it.y, fw:f[0], fh:f[1], hp:d.role === 'wall' ? FENCE_HP[Math.min(3, lv - 1)] : Math.round(d.hp * m), role:d.role, range:d.range || 0, dmg:Math.round((d.dmg || 0) * m * 10) / 10, rate:d.rate || 1, loot:LOOT.indexOf(it.k) >= 0};
 if (lv > 1) out.lv = lv;
 for (const key of ['air', 'splash', 'minR', 'push', 'hide', 'tk', 'cap']) if (d[key] !== undefined) out[key] = d[key];
 if (d.role === 'trap'){ out.dmg = Math.round((d.dmg || 0) * m); out.splash = d.splash || 0; }
 return out;
}
function fenceName(lv){ return FENCE_NAMES[Math.max(0, Math.min(3, (lv | 0) - 1))]; }

// faces: top, +x, -x, +y, -y (no bottoms, nothing sits under the ground)
const FACES = [[0, 0, 1], [1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]];

// ---------- Turf: smooth shapes for people ----------

// the ground, paths and the forest ring around the grid; scene.ground: {w, h, path:Set('x,y'), clear:Set('x,y'), seed}
function groundBoxes(sc){

 B.push([-26, -26, -.06, w + 52, h + 52, .04, 15]);
 for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
  const k = x + ',' + y, r = hash(x + 7, y + 3);
  const m = sc.tile ? sc.tile(x, y) : path.has(k) ? 3 : (r < .18 ? 1 : r > .9 ? 2 : 0);
  B.push([x, y, -.02, 1, 1, .04 + (path.has(k) ? 0 : r * .02), m]);
  if (!sc.tile && !path.has(k) && !busy.has(k) && !clear.has(k) && r > .975) B.push([x + .3, y + .4, 0, .25, .2, .12, 7]); // a stray stone
 }
 if (sc.edge){ sc.edge.boxes.forEach(b => B.push(b)); return B; }
 // pines outside the walls and beyond the grid
 const tree = (x, y, s) => { B.push([x - .07 * s, y - .07 * s, 0, .14 * s, .14 * s, .45 * s, 23]);
  for (let i = 0; i < 4; i++){ const r = (.62 - i * .14) * s; B.push([x - r, y - r, (.35 + i * .32) * s, r * 2, r * 2, .3 * s, i % 2 ? 15 : 14]); } };

  const inGrid = x >= 0 && y >= 0 && x < w && y < h, k = x + ',' + y;
  if (inGrid && (path.has(k) || clear.has(k) || busy.has(k))) continue;
  const ring = sc.ring, inside = ring && x >= ring[0] - 1 && y >= ring[1] - 1 && x <= ring[2] + 1 && y <= ring[3] + 1;
  if (inside) continue;
  const r = hash(x * 3 + 11, y * 5 + 2), d = Math.max(0, Math.hypot(x - w / 2, y - h / 2) - 11);
  if (Math.hypot(x - w / 2, y - h / 2) > 24) continue;

}

function build(sc){
 const V = [], I = [];
 groundBoxes(sc).forEach(b => pushBox(V, I, b, 0, 0));
 let hasAnim = false; st.lights = []; st.smokeSrc = []; st.labels.forEach(l => l.el.remove()); st.labels = []; st.parts = [];
 if (sc.edge && sc.edge.lights) sc.edge.lights.forEach(L => st.lights.push(L));
 (sc.parts || []).forEach(p => {
  if (st.drag && st.drag.key === p.key){ st.drag.part = p; }
  else if (p.anim && !st.reduce){ hasAnim = true; if (!st.anim || st.anim.part.id !== p.id) st.anim = {part:p, t:0, dur:3}; }
  else p.boxes.forEach(b => pushBox(V, I, b, p.x, p.y));
  (p.lights || []).forEach(L => st.lights.push([L[0] + p.x, L[1] + p.y, L[2], L[3]]));
  (p.smoke || []).forEach(s => st.smokeSrc.push([s[0] + p.x, s[1] + p.y, s[2]]));
  if (p.tap) st.parts.push({id:p.id, key:p.key, x0:p.x, y0:p.y, x1:p.x + p.fw, y1:p.y + p.fh, top:p.top || 1, boxes:p.boxes.concat([[-.12, -.12, 0, p.fw + .24, p.fh + .24, .14, 0]])});
  if (p.label){ const el = document.createElement('div'); el.className = 'vlab' + (p.labelCls ? ' ' + p.labelCls : ''); el.innerHTML = p.label; el.dataset.b = p.id; labelLayer.appendChild(el);
   st.labels.push({el, key:p.key, empty:/empty/.test(p.labelCls || ''), x:p.x + p.fw / 2, y:p.y + p.fh / 2, z:(p.top || 1) + .2}); }

}

// ---------- time of day: the sun by day, a blood moon by night ----------
function sky(){
 const d = new Date(), h = st.hour != null ? st.hour : d.getHours() + d.getMinutes() / 60;
 // day weight: 0 at night, 1 at midday, soft at dawn and dusk
 const day = Math.max(0, Math.min(1, Math.min((h - 5.5) / 2, (19.5 - h) / 2)));
 const t = (h - 6) / 12 * Math.PI, sunD = norm([-Math.cos(t) * .8 - .2, .55, Math.max(.35, Math.sin(t)) * 1.2]);
 const moonD = norm([-.55, .35, .9]);
 const L = (a, b) => a.map((v, i) => v + (b[i] - v) * day);
 const P = st.palette; if (P) return {day, dir:norm(L(moonD, sunD)), sunC:L(P.sunC[0], P.sunC[1]), amb:L(P.amb[0], P.amb[1]), sky:L(P.sky[0], P.sky[1]), bg:L(P.bg[0], P.bg[1]), torch:P.torch[0] + (P.torch[1] - P.torch[0]) * day};
 return {day, dir:norm(L(moonD, sunD)), sunC:L([.52, .2, .24], [1.0, .86, .7]), amb:L([.17, .16, .26], [.42, .41, .46]), sky:L([.12, .05, .08], [.34, .36, .44]),
  bg:L([.035, .02, .03], [.12, .1, .09]), torch:1.25 - .75 * day};
}

// slide the camera so a spot on the lot sits clear of the sheet
function focusOn(x, y){ if (!gl3d) return; const v = VIL.view(), r = $('stage').getBoundingClientRect(), tall = r.width < r.height;
 const p = VIL.project(x, y, 0), a = VIL.project(x + 1, y, 0), b = VIL.project(x, y + 1, 0); if (!p || !a || !b) return;
 const ex = p[0] - (tall ? r.width * .5 : r.width * .27), ey = p[1] - (tall ? r.height * .36 : r.height * .5);
 const j11 = a[0] - p[0], j21 = a[1] - p[1], j12 = b[0] - p[0], j22 = b[1] - p[1], det = j11 * j22 - j12 * j21; if (!det) return;
 VIL.view({tx:v.tx + (j22 * ex - j12 * ey) / det, ty:v.ty + (-j21 * ex + j11 * ey) / det, zoom:v.zoom}); }
function toHome(){
 if (!save.block){ save.block = T.starterBlock(); save.cash = T.START.cash; save.sup = T.START.sup; save.army = Object.assign({}, T.START.army); save.nk = 20; saveGame(); firstHome = true; }
 if (gl3d) VIL.battle(null); lightFor(null); homeSel = null; fenceMode = null; closeSheet(); show('home'); homePaint(); setEdit(); cam('home');
 if (firstHome){ firstHome = false; openSheet('crew'); }
}

// ---------- updates: a new build on the server prompts a reload ----------
function checkUpdate(){
 fetch('sw.js', {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/turf-v([\d.]+)/); if (m && m[1] !== VER){ toast('New version ' + m[1] + ', tap to reload', 12000, () => location.reload()); if ('serviceWorker' in navigator) swUpdate(); } }).catch(() => {});
}
function bust(){
 // the version buster: if the page on the server is newer than this copy, load it once
 try { if (sessionStorage.getItem('turf.bust') === VER) return; } catch (e){}
 fetch(location.pathname, {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/<meta name="build" content="([^"]+)"/);
  if (m && m[1] !== VER){ try { sessionStorage.setItem('turf.bust', VER); } catch (e){} location.replace(location.pathname + '?v=' + m[1]); } }).catch(() => {});
}
// ask the browser to look for a newer service worker now, not whenever it gets around to it
function swUpdate(){ try { navigator.serviceWorker.getRegistration().then(r => { if (r) r.update().catch(() => {}); }).catch(() => {}); } catch (e){} }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').then(swUpdate).catch(() => {});
if (location.protocol.startsWith('http')){ bust(); checkUpdate(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); }); }

// ---------- go ----------
mountMap();
// a brand new player sees the intro once, before the title; after that it is a button on the title
if (!introSeen() && !save.rescued && !save.tries) introPlay(); else introFind(list => { $('introBtn').hidden = !list.length; });
{ const done = settlePending(); toTitle(); if (done) setTimeout(() => toast('Your last fight played out while you were away: ' + done.stars + (done.stars === 1 ? ' star' : ' stars'), 3200), 900); }
// test hook (used by the headless proof): read-only peeks at the fight
window.TURF_TEST = {block:() => JSON.parse(JSON.stringify(save.block)), home:() => ({cash:save.cash, sup:save.sup, army:Object.assign({}, save.army), sel:homeSel, sheet:sheetKind, fence:fenceMode, color:MY_CREW, lv:save.block ? T.houseLv(save.block) : 0, n:save.block ? save.block.length : 0}),
 state:() => ({screen:['title', 'story', 'hud', 'result', 'watch', 'home'].find(k => $(k).classList.contains('on')), tick:sim ? sim.tick() : 0, counts:Object.assign({}, counts), sel, finished, gl3d, reports:save.reports.length}),
 camp:() => JSON.parse(JSON.stringify({camp:save.camp, night:save.night})), hit, intro:() => ({on:!$('intro').hidden, at:introAt, shots:introList.map(s => s.n), video:!$('introVid').hidden}), icon:(l, n) => miniIcon(l, n), select:k => { selectItem(k, true); openSheet('info'); },
 toScreen:(x, y, z) => gl3d ? VIL.project(x, y, z || 0) : null, result:() => sim ? sim.result() : null};
})();

</script>
