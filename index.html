<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="build" content="0.7.4">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#f1eee8;--dim:#a8a49c;--street:#16171b;--panel:#1f2126;--line:#34373e;--sodium:#f2a23a;--lav:#b9a3ff;--blue:#4f6bff;--brick:#8a3b2e;--ok:#5fd38a;--bad:#f0503a;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--street);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0}
.vilcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vlabs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vlab{position:absolute;left:0;top:0;pointer-events:none}
#fb{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}

/* layers over the map */
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.layer > *{pointer-events:auto}

/* title */
#title{background:linear-gradient(180deg,rgba(14,15,18,.2) 0%,rgba(14,15,18,0) 40%,rgba(14,15,18,.86) 78%)}
/* painted pictures behind the title and the Viceroy's story cards; if one fails to load it hides and the 3D block shows instead */
.layer > .pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.layer > .pic[hidden],.layer > .pic[hidden] + .shade{display:none}
.layer > .shade{position:absolute;inset:0;pointer-events:none}
#titlePic{object-position:50% 55%}
#title .shade{background:linear-gradient(180deg,rgba(14,15,18,.1) 0%,rgba(14,15,18,0) 45%,rgba(14,15,18,.9) 82%)}
#story .shade{background:linear-gradient(180deg,rgba(10,10,12,0) 45%,rgba(10,10,12,.75) 100%)}
#title .mark{position:absolute;left:calc(20px + var(--safe-l));right:calc(20px + var(--safe-r));bottom:calc(150px + var(--safe-b));pointer-events:none}
#title .mark svg{width:min(72vw,300px);height:auto;display:block}
#title .mark h1.painted img{display:block;width:auto;height:auto;max-width:min(80vw,360px);max-height:34vh;margin-left:-8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
#title .mark p{margin-top:12px;font-size:clamp(15px,4.2vw,18px);color:var(--dim);max-width:36ch;line-height:1.4}
#title .go{position:absolute;left:calc(20px + var(--safe-l));bottom:calc(64px + var(--safe-b));min-width:200px;padding:16px 26px;background:var(--sodium);color:#1a1209;font-weight:800;font-size:18px;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14}
#title .go:active{transform:translateY(3px);box-shadow:0 1px 0 #9a5d14}
#title .alt{position:absolute;left:calc(236px + var(--safe-l));bottom:calc(74px + var(--safe-b));padding:10px 4px;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* story card */
#story{background:rgba(10,10,12,.35)}
.card{position:absolute;left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));bottom:calc(16px + var(--safe-b));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;gap:14px;align-items:flex-start;max-width:560px;margin:0 auto}
.card .face{flex:0 0 96px;height:96px;border-radius:4px;overflow:hidden;border:2px solid var(--lav)}
.card .face[hidden]{display:none}
.card .face img{width:100%;height:100%;object-fit:cover;display:block}
.card .who{color:var(--lav);font-weight:800;font-size:15px;margin-bottom:4px}
.card .say{font-size:clamp(16px,4.4vw,19px);line-height:1.4}
.card .tap{display:block;margin-top:10px;color:var(--dim);font-size:13px}

/* attack HUD */
#hud .top{position:absolute;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));display:flex;align-items:center;gap:10px;pointer-events:none}
#hud .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px;min-width:72px;text-align:center}
#hud .score{display:flex;align-items:center;gap:6px;background:rgba(14,15,18,.78);padding:6px 10px;border-radius:4px}
#hud .score b{font-size:20px;font-variant-numeric:tabular-nums;min-width:3.2ch}
.stars{display:flex;gap:3px}
.stars i{width:20px;height:20px;display:block;background:#3a3c42;clip-path:polygon(50% 0,63% 36%,100% 38%,71% 61%,81% 100%,50% 78%,19% 100%,29% 61%,0 38%,37% 36%)}
.stars i.on{background:var(--sodium)}
#hud .end{margin-left:auto;pointer-events:auto;background:rgba(14,15,18,.78);border:1px solid var(--line);padding:9px 14px;border-radius:4px;font-weight:700}
#hud .end:active{background:#2a2c31}
#hud .tip{position:absolute;top:calc(92px + var(--safe-t));left:50%;transform:translateX(-50%);background:rgba(14,15,18,.85);padding:8px 14px;border-radius:4px;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#hud .bar{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px - var(--safe-l) - var(--safe-r));bottom:calc(10px + var(--safe-b));display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain;touch-action:pan-x;scrollbar-width:none}
#hud .bar::-webkit-scrollbar{display:none}
#hud .bar .troop{flex:0 0 auto}
.troop{position:relative;width:96px;height:112px;background:var(--panel);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 4px 6px}
.troop canvas{margin-bottom:2px}
.troop .nm{font-size:13px;font-weight:700}
.troop .n{position:absolute;top:4px;right:6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.troop.sel{border-color:var(--sodium);box-shadow:0 0 0 2px var(--sodium) inset}
.troop.out{opacity:.38}
.troop:active{transform:scale(.96)}
.bar.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
#result{background:rgba(10,10,12,.55)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 20px 18px}
.panel h2{font-size:26px;line-height:1.15;margin-bottom:8px}
.panel .stars{gap:8px;margin:12px 0 6px}
.panel .stars i{width:44px;height:44px}
.panel .pct{color:var(--dim);margin-bottom:16px}
.panel .acts{display:flex;flex-direction:column;gap:10px}
.btn{padding:14px 16px;border-radius:4px;font-weight:700;font-size:17px;background:#2c2e34;border:1px solid var(--line);text-align:left}
.btn.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14}
.btn:active{background:#3a3c42}
.btn.main:active{background:#d98c2a}

/* watch */
#watch .ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));display:flex;gap:8px;background:rgba(14,15,18,.85);padding:8px;border-radius:6px}
#watch .ctl button{min-width:64px;padding:12px 10px;border:1px solid var(--line);border-radius:4px;font-weight:700}
#watch .lbl{position:absolute;top:calc(12px + var(--safe-t));left:calc(12px + var(--safe-l));background:rgba(14,15,18,.8);padding:6px 10px;border-radius:4px;font-weight:700}

/* your block */
#home .res{position:absolute;top:calc(10px + var(--safe-t));left:calc(8px + var(--safe-l));right:calc(62px + var(--safe-r));display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(14,15,18,.82);padding:6px 8px;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(14px,3.9vw,17px);pointer-events:auto;min-height:44px}
.chip.full b{color:var(--sodium)}
.ic{display:block;width:20px;height:13px;border-radius:2px}
.ic.cash{background:#5fd38a;box-shadow:inset 0 0 0 2px #2d7a4b}
.ic.sup{width:16px;height:16px;background:#96764f;box-shadow:inset 0 0 0 2px #5c452a}
.ic.rep{width:16px;height:16px;border-radius:50%;background:var(--sodium);box-shadow:inset 0 0 0 3px #9a5d14}
.ic.crew{width:14px;height:18px;border-radius:7px 7px 2px 2px;background:var(--lav)}
#home .dock{position:absolute;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));bottom:calc(14px + var(--safe-b));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;pointer-events:none}
#home.sheeton .dock{display:none}
.hb{pointer-events:auto;min-width:84px;min-height:52px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-weight:800;font-size:17px}
.hb.main{background:var(--sodium);color:#1a1209;border-color:#9a5d14;border-radius:4px 14px 4px 14px;box-shadow:0 4px 0 #9a5d14;min-width:112px}
.hb:active{transform:translateY(2px)}
#home .hint{position:absolute;top:calc(64px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(14,15,18,.92);border:1px solid var(--sodium);padding:6px 6px 6px 14px;border-radius:4px;font-size:15px;width:max-content;max-width:94vw}
#home .hint[hidden]{display:none}
#home .hint button{min-height:44px;padding:8px 14px;background:var(--sodium);color:#1a1209;font-weight:800;border-radius:3px}
.sheet{position:absolute;left:calc(8px + var(--safe-l));right:calc(8px + var(--safe-r));bottom:calc(8px + var(--safe-b));max-width:520px;margin:0 auto;max-height:58vh;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 4px 4px;padding:62px 14px 12px}
#sheetBody{overflow-y:auto;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.sheet .x{position:absolute;top:10px;right:10px;z-index:1;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:700;font-size:14px}
.sheet h3{font-size:20px;line-height:1.25;margin-bottom:6px}
.sheet .x{left:14px;right:auto}
.sheet h3 span{color:var(--dim);font-size:14px;font-weight:600;margin-left:8px;white-space:nowrap}
.sheet p{color:var(--dim);font-size:15px;line-height:1.4;margin-bottom:8px}
.sheet p.stat{color:var(--ink)}
.sheet .btn{display:block;width:100%;margin:10px 0}
.btn.no{opacity:.45}
.rows{display:flex;flex-direction:column;gap:8px;clear:both}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#26282d;border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:60px}
.row .nm{font-weight:800;font-size:16px}
.row .sub{color:var(--dim);font-size:13px;line-height:1.3}
.row .mid{flex:1;min-width:0}
.row .pr{font-weight:800;font-size:13px;white-space:nowrap;text-align:right;line-height:1.35}
.row.no{opacity:.5}
.row canvas{flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px;clear:both}
.sw button{width:46px;height:46px;border-radius:4px 12px 4px 12px;border:2px solid var(--line)}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.mini{flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#2c2e34;font-weight:800;min-width:46px;min-height:46px;font-size:15px}
.mini:active,.row:active{background:#3a3c42}
@media (orientation:landscape) and (max-height:500px){.sheet{left:auto;margin:0;width:min(48vw,430px);max-height:calc(100vh - 16px - var(--safe-b))}}

/* always there */
#fsBtn{position:fixed;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:30;display:none;align-items:center;gap:8px;min-width:44px;min-height:44px;padding:10px 13px;background:rgba(14,15,18,.82);border:1px solid var(--line);border-radius:4px;font-weight:700;font-size:15px}
#title.on ~ #fsBtn:not([hidden]),#home.on ~ #fsBtn:not([hidden]){display:flex}
#home.on ~ #fsBtn span,#home.sheeton ~ #fsBtn:not([hidden]){display:none}
#fsBtn i{display:block;width:18px;height:18px;--c:var(--ink);background:linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) top/100% 2px no-repeat,linear-gradient(to right,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) bottom/100% 2px no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) left/2px 100% no-repeat,linear-gradient(to bottom,var(--c) 6px,transparent 6px,transparent 12px,var(--c) 12px) right/2px 100% no-repeat}
#fsBtn:active{background:#2a2c31}
#badge{position:fixed;right:calc(8px + var(--safe-r));bottom:calc(4px + var(--safe-b));font-size:11px;color:var(--dim);padding:6px;z-index:30;opacity:.8}
#story.on ~ #badge,#hud.on ~ #badge,#home.on ~ #badge{bottom:auto;top:calc(56px + var(--safe-t));right:auto;left:calc(8px + var(--safe-l))}
#title.on ~ #badge{min-height:44px;display:flex;align-items:flex-end}
#toast{position:fixed;left:50%;top:calc(110px + var(--safe-t));transform:translateX(-50%);background:#0e0f12;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:4px;font-size:15px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.act{pointer-events:auto;border-color:var(--sodium)}
#nogl{position:fixed;left:12px;right:12px;top:calc(12px + var(--safe-t));background:#2a1d14;border:1px solid #7a4a1c;padding:10px 12px;border-radius:4px;font-size:14px;display:none;z-index:35}
@media (prefers-reduced-motion:reduce){.bar.nudge{animation:none}}
#story{pointer-events:auto}
#hud .bar{pointer-events:none}
#hud .troop{pointer-events:auto}
@media (orientation:landscape) and (max-height:500px){
 .troop{width:84px;height:86px}.troop canvas{width:52px!important;height:52px!important}
 #hud .bar{left:auto;transform:none;right:calc(8px + var(--safe-r));max-width:calc(100% - 140px - var(--safe-l) - var(--safe-r))}
 #title .mark{bottom:calc(96px + var(--safe-b))}#title .mark svg{width:min(40vw,240px)}#title .go{bottom:calc(20px + var(--safe-b))}#title .alt{bottom:calc(30px + var(--safe-b))}#title.layer #introBtn{left:calc(384px + var(--safe-l));bottom:calc(30px + var(--safe-b))}
 .card{max-width:640px}}
.tod{display:flex;gap:0;margin:4px 0 6px}
.tod button{flex:1;min-height:46px;border:1px solid var(--line);background:#26282d;font-weight:800;font-size:15px;color:var(--dim)}
.tod button:first-child{border-radius:4px 0 0 4px}.tod button:last-child{border-radius:0 4px 4px 0}
.tod button.on{background:#e8d9a8;color:#1b1b1d;border-color:#e8d9a8}
.crewhd{display:flex;align-items:center;gap:10px;margin-top:10px}
.crewhd i{flex:0 0 auto;width:14px;height:40px;border-radius:2px}
.crewhd .nm{font-weight:800;font-size:16px}.crewhd .sub{color:var(--dim);font-size:13px;line-height:1.3}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.blk{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:76px;padding:8px 4px;border:1px solid var(--line);border-radius:6px 2px 6px 2px;background:#26282d}
.blk .nm{font-weight:800;font-size:13px;text-align:center;line-height:1.15}
.blk .sub{color:var(--dim);font-size:11px;text-align:center;line-height:1.2}
.blk .st{display:flex;gap:2px}.blk .st i{width:11px;height:11px;background:#44464c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.blk .st i.on{background:#f0c64a}
.blk.no{opacity:.45}.blk:active{background:#3a3c42}
@media (max-width:360px){.blocks{grid-template-columns:repeat(2,1fr)}}
#sheetBody h4{margin:16px 0 2px;font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:8px}
#sheetBody h4 span{color:var(--dim);font-weight:600;font-size:14px}
.troop.boss{border-color:#6b6f78}
.troop.ready{border-color:#f0c64a;box-shadow:0 0 0 2px #f0c64a inset;animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 4px #f0c64a inset}}
.troop.item .nm{font-size:12px;line-height:1.1;text-align:center}
.troop.boss .nm{font-size:12px;line-height:1.1;text-align:center}
@media (prefers-reduced-motion:reduce){.troop.ready{animation:none}}
.troop.out:not(.boss){display:none}
#title #introBtn{position:absolute;left:calc(20px + var(--safe-l));bottom:calc(18px + var(--safe-b));padding:10px 4px;color:var(--dim);font-size:15px;text-decoration:underline;text-underline-offset:4px;background:none;border:0}
#intro{position:fixed;inset:0;z-index:40;background:#0b0c0f;overflow:hidden}
#intro[hidden]{display:none}
#introBg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(22px) brightness(.45);pointer-events:none}
#introFrame{position:absolute;inset:0;pointer-events:none}
#introFrame .ilayer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:0;transition:opacity .45s ease}
#introFrame .ilayer.on{opacity:1}
#introFrame .ilayer.push{animation:introPush 6.4s linear both}
@keyframes introPush{from{transform:scale(1)}to{transform:scale(1.07)}}
#intro::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(11,12,15,0),rgba(11,12,15,.88) 70%);pointer-events:none}
#introCap{position:absolute;z-index:1;left:calc(22px + var(--safe-l));right:calc(22px + var(--safe-r));bottom:calc(78px + var(--safe-b));font-size:clamp(19px,5.2vw,28px);font-weight:800;line-height:1.25;color:#f3ead2;max-width:24ch;text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0}
#introCap.in{animation:introCap .7s .35s ease-out both}
@keyframes introCap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#introPips{position:absolute;z-index:1;left:calc(22px + var(--safe-l));bottom:calc(40px + var(--safe-b));display:flex;gap:6px}
#introPips i{width:26px;height:4px;background:rgba(255,255,255,.22)}
#introPips i.done{background:#e0b64a}#introPips i.now{background:linear-gradient(90deg,#e0b64a 50%,rgba(255,255,255,.22) 50%);background-size:200% 100%;animation:introPip 6s linear both}
@keyframes introPip{from{background-position:100% 0}to{background-position:0 0}}
#introSkip{position:absolute;z-index:1;right:calc(16px + var(--safe-r));bottom:calc(22px + var(--safe-b));min-width:72px;min-height:44px;padding:10px 16px;font-weight:800;font-size:15px;color:#f3ead2;background:rgba(11,12,15,.6);border:1px solid rgba(255,255,255,.3);border-radius:4px}
#introSkip:active{background:rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){#introFrame .ilayer.push,#introCap.in,#introPips i.now{animation:none}#introCap{opacity:1}}
.hb{position:relative}
.hb .dot{position:absolute;right:-5px;top:-5px;width:14px;height:14px;border-radius:50%;background:#e2603a;border:2px solid #16171b}
.hb .dot[hidden]{display:none}
.bar2{height:8px;background:#34363c;margin:2px 0 10px}.bar2 i{display:block;height:100%;background:#e0b64a}
.mini.go2{background:var(--sodium);color:#1a1209;border-color:#9a5d14;font-weight:800}
.btn.runback{margin:8px 0 2px;width:100%}
#resStars i.on{animation:starPop .45s cubic-bezier(.2,1.6,.4,1) both}#resStars i.on:nth-child(2){animation-delay:.25s}#resStars i.on:nth-child(3){animation-delay:.5s}
@keyframes starPop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#resStars i.on{animation:none}}

/* the coach: first-run tips */

<script>
// base.js · the reusable base-building engine (grid, footprints, placement, wall joins, paths, seeded random).
// No game names live here: every game hands in its own building defs, unlock table and starter template.
// Ravenmarrow 3.0 · Nov 18 2026
const BASE = (() => {
'use strict';
const W = 28, H = 28;   // grid size in tiles

// seeded random: mulberry32. Every sim and every replay draws from this, never Math.random

function fpOf(defs, k){ const d = defs[k]; return d && d.fp ? d.fp : [1, 1]; }
function cells(defs, it){ const f = fpOf(defs, it.k), o = []; for (let y = 0; y < f[1]; y++) for (let x = 0; x < f[0]; x++) o.push([it.x + x, it.y + y]); return o; }
// the grid as an array of item indexes (-1 empty)
function grid(layout, defs, w, h){ w = w || W; h = h || H; const g = new Int16Array(w * h).fill(-1);
 (layout.items || []).forEach((it, i) => cells(defs, it).forEach(([x, y]) => { if (x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = i; }));
 return {w, h, g, at(x, y){ return x < 0 || y < 0 || x >= w || y >= h ? -2 : g[y * w + x]; }}; }

function wallShape(layout, x, y){ const set = new Set((layout.items || []).filter(i => i.k === 'wall').map(i => i.x + ',' + i.y));
 return (set.has(x + ',' + (y - 1)) ? 1 : 0) | (set.has((x + 1) + ',' + y) ? 2 : 0) | (set.has(x + ',' + (y + 1)) ? 4 : 0) | (set.has((x - 1) + ',' + y) ? 8 : 0); }

// counts: how many walls the unlock table allows. Anything that would overlap is dropped, never stacked
function starterLayout(defs, tpl, wallCount){
 const L = {v:1, items:[]};
 tpl.items.forEach(it => { const c = {k:it.k, x:it.x, y:it.y}; if (fits(L, c, defs)) L.items.push(c); });
 const [x0, y0, x1, y1] = tpl.ring, gate = new Set((tpl.gate || []).map(p => p[0] + ',' + p[1])), ring = [];

// tile-centre of an item's footprint
function centre(defs, it){ const f = fpOf(defs, it.k); return [it.x + f[0] / 2, it.y + f[1] / 2]; }

// shortest walk on the tile grid (4 ways), passable(x, y) decides; the start and goal tiles are always allowed. Returns [[x,y],...] or null
function path(gr, from, to, passable){

 for (let qi = 0; qi < q.length; qi++){ const [x, y] = q[qi];
  if (x === to[0] && y === to[1]){ const out = []; let k = key(x, y); while (k !== -1){ out.push([k % w, Math.floor(k / w)]); k = prev[k]; } return out.reverse(); }
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const nx = x + dx, ny = y + dy; if (!ok(nx, ny) || seen[key(nx, ny)]) continue; seen[key(nx, ny)] = 1; prev[key(nx, ny)] = key(x, y); q.push([nx, ny]); } }

// can anything walk in from the edge of the map to touch this item? (raiders and villagers need a way in)
function reachable(layout, defs, it){

function validLayout(layout, defs, max, need, key){

 for (const it of items){ const f = fpOf(defs, it.k);
  if (!Number.isInteger(it.x) || !Number.isInteger(it.y) || it.x < 0 || it.y < 0 || it.x + f[0] > W || it.y + f[1] > H) return {ok:false, why:'bounds', k:it.k};

// The recipe holds everything the fight needs (numbers already worked out by the game), so a replay years later
// comes out the same. Fixed 10 ticks a second, seeded random only, plain arithmetic and sqrt (same on every phone).
// recipe: {simVer, seed, items:[{key,k,x,y,fw,fh,hp,role:'core'|'bld'|'wall'|'tower'|'trap'|'plot',range,dmg,rate}],
//  attackers:[{look,hp,atk,def,speed,range,fly,prefer:'any'|'def',wallMult,splash}],
//  defenders:[{look,hp,atk,def,speed,range,hero}], guard:0..1 (damage cut for defenders inside the walls)}

// at (x, y) on tick t; raidStart() runs the fight one tick at a time so a player can add deploys while it runs, and simRaid()
// with the saved deploys plays the same fight again. Without R.deploys every line below behaves exactly as before.

 const items = R.items.map((it, i) => ({i, key:it.key, k:it.k, x:it.x, y:it.y, fw:it.fw, fh:it.fh, role:it.role, max:it.hp || 0, hp:it.hp || 0, range:it.range || 0, dmg:it.dmg || 0, rate:it.rate || 1, loot:!!it.loot, cd:0, dealt:0, hit:new Set(), offT:0,

 const totalHp = scoring.reduce((s, b) => s + b.max, 0) || 1;
 const occ = new Int16Array(W * H).fill(-1);
 solid.forEach(b => { for (let y = b.y; y < b.y + b.fh; y++) for (let x = b.x; x < b.x + b.fw; x++) if (x >= 0 && y >= 0 && x < W && y < H) occ[y * W + x] = b.i; });
 const core = items.find(b => b.role === 'core');
 // spawn: one side of the map, chosen by the seed
 const units = [];
 if (dep) R.attackers.forEach((a, n) => {
  units.push({id:n, side:'a', look:a.look, x:0, y:0, hp:a.hp, max:a.hp, atk:a.atk, def:a.def || 0, speed:a.speed, range:a.range, fly:!!a.fly, prefer:a.prefer || 'any', wallMult:a.wallMult || 1, splash:a.splash || 0, ...xtra(a),
   delay:0, wait:true, cd:Math.floor(rand() * 8), tgt:null, path:null, pi:0, mode:0, face:2, dealt:0, alive:true}); });

   delay:Math.floor(n * 3), cd:Math.floor(rand() * 8), tgt:null, path:null, pi:0, mode:0, face:0, dealt:0, alive:true}); }); }

function savePending(now){ if (!sim || finished || !R || R.mode === 'rescue') return; if (!now && sim.tick() % 50) return;
 const dep = sim.queued(); if (!dep.length) return;
 const p = {at:Date.now(), simVer:B.SIM_VER, deployVer:B.DEPLOY_VER, recipe:Object.assign({}, R, {deploys:dep, endAt:sim.endAt()})};
 try { localStorage.setItem(PEND_KEY, JSON.stringify(p)); } catch (e){ memPend = p; } }
let memPend = null;
function loadPending(){ let raw = null; try { raw = localStorage.getItem(PEND_KEY); } catch (e){} let p = null; try { p = raw ? JSON.parse(raw) : memPend; } catch (e){ p = null; } return p; }
function clearPending(){ memPend = null; try { localStorage.removeItem(PEND_KEY); } catch (e){} }
function cleanPending(p){ if (!p || typeof p !== 'object' || !p.recipe) return null; const r = p.recipe; if (p.simVer !== B.SIM_VER || p.deployVer !== B.DEPLOY_VER) return null;
 if (!['items', 'attackers', 'defenders', 'deploys'].every(k => Array.isArray(r[k])) || (r.mode !== 'raid' && r.mode !== 'camp' && !(r.mode === 'pvp' && r.pvp && typeof r.pvp.uid === 'string' && typeof r.pvp.packed === 'string'))) return null;
 if (r.mode === 'camp' && !(Array.isArray(r.camp) && r.camp[0] >= 0 && r.camp[0] < T.CAMP.crews && r.camp[1] >= 0 && r.camp[1] < T.CAMP.blocks)) return null;
 return {at:+p.at || 0, recipe:r}; }
function settlePending(){ const p = cleanPending(loadPending()); clearPending(); if (!p) return null;
 try { const res = B.simRaid(JSON.parse(JSON.stringify(p.recipe))).result; return settle(p.recipe, res); } catch (e){ return null; } }

 { const due = jobsDue(); if (raid && due) setTimeout(() => toast(due === 1 ? 'A job is done. Collect it on your block.' : due + ' jobs are done. Collect them on your block.', 2600), 1200); }

 if (camp && lastReport.firstTake && lastReport.recipe.camp[1] === T.CAMP.blocks - 1) setTimeout(() => toast('That was the last of ' + crew.name + ' turf', 2600), 600);

let wSpeed = 1, wPaused = false, wFrames = null, wI = 0, wRaf = 0, wLastSfx = -1;
function watch(rep){
 if (!rep) return; const Rw = JSON.parse(JSON.stringify(rep.recipe)); setBlock(blockOf(Rw), Rw.mode === 'practice' || rep.def ? 'own' : 'enemy', Rw.crewColor); vicOn = Rw.mode === 'rescue'; lightFor(Rw); if (gl3d) VIL.edit(null);
 const out = B.simRaid(Rw, {record:true}), m = meta(Rw); { const pt = partyText(Rw.party); if (pt) setTimeout(() => toast(pt, 2600), 500); }
 wFrames = out.frames; units = m.u; items = m.it; viceroyFree = false; lastDown = 'x'; paint(null); wSpeed = 1; wPaused = false;
 $('wPlay').textContent = 'Pause'; $('wSpeed').textContent = '2x'; $('watchLbl').textContent = 'Replay · ' + rep.stars + (rep.stars === 1 ? ' star' : ' stars');
 const onTick = i => { const f = wFrames[i], down = downOf(Rw.items, f), coreI = Rw.items.findIndex(b => b.role === 'core'); try { for (let j = Math.max(wLastSfx + 1, i - 6); j <= i; j++) fightSfx(wFrames[j], j > 0 ? wFrames[j - 1] : null, Rw); } catch (e){} wLastSfx = i;
  if (vicOn && f.b[coreI] <= 0 && !viceroyFree){ viceroyFree = true; lastDown = 'x'; } paint(down); };
 sndRecipe = Rw; wLastSfx = -1; show('watch'); cam('watch');
 const wr = ringsOf(Rw);
 const onTick2 = i => { onTick(i); if (wr.length){ const f = wFrames[i]; wr.forEach(r => { if (r.follow != null){ const u = f.u.find(q => q[0] === r.follow); if (u){ r.x = u[1]; r.y = u[2]; } } }); } };
 if (gl3d){ VIL.battle({frames:wFrames, tick:B.TICK, units, items, speed:1, follow:true, zoom:VIL.view().zoom, onTick:onTick2, onEnd:endWatch}); VIL.rings(wr); }
 else { wI = 0; cancelAnimationFrame(wRaf); let a = 0, lt = 0; const step = now => { wRaf = requestAnimationFrame(step); const dt = Math.min(.25, (now - (lt || now)) / 1000); lt = now; if (wPaused) return; a += dt * wSpeed;
   while (a >= B.TICK){ a -= B.TICK; wI++; if (wI >= wFrames.length){ cancelAnimationFrame(wRaf); endWatch(); return; } FB.frame(wFrames[wI]); onTick(wI); } }; wRaf = requestAnimationFrame(step); }
}

// ---------- your block: build, level up, train a crew ----------
let homeSel = null, fenceMode = null, sheetKind = null, firstHome = false;
const item = key => save.block ? save.block.find(i => i.key === key) : null;
const costText = c => !c ? '' : (c[0] ? c[0] + ' Cash' : '') + (c[0] && c[1] ? ' + ' : '') + (c[1] ? c[1] + ' Supplies' : '') || 'Free';
const has = c => save.cash >= c[0] && save.sup >= c[1];
function pay(c){ save.cash -= c[0]; save.sup -= c[1]; }
// stashes cap what you can hold; returns what actually went in
// today's record, rolled over if the date has changed since it was last touched
function dayNow(){ const n = new Date(); save.day = T.dayRoll(save.day, T.dayKey(n), T.dayKey(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1))); return save.day; }
function addRes(cash, sup){ const cap = T.storeCap(save.block), c0 = save.cash, s0 = save.sup;
 save.cash = Math.max(c0, Math.min(cap.cash, c0 + cash)); save.sup = Math.max(s0, Math.min(cap.sup, s0 + sup)); return {cash:save.cash - c0, sup:save.sup - s0}; }
function gangHex(c){ const m = ART.MATS[MINI.M[MINI.GANGS[c][0]]] || [185, 163, 255]; return 'rgb(' + m[0] + ',' + m[1] + ',' + m[2] + ')'; }
function homeHud(){
 { const dot = $('hJobs').querySelector('.dot'); dot.hidden = !jobsDue(); }
 const cap = T.storeCap(save.block); $('hCash').textContent = save.cash; $('hSup').textContent = save.sup;
 $('hCash').parentNode.classList.toggle('full', save.cash >= cap.cash); $('hSup').parentNode.classList.toggle('full', save.sup >= cap.sup);
 $('hRep').textContent = save.rep; $('hArmy').textContent = T.armySize(save.army) + '/' + T.armyCap(save.block); $('hCrew').querySelector('.ic').style.background = gangHex(MY_CREW);
 const hint = $('hHint'); hint.hidden = !fenceMode;
 if (fenceMode){ const left = T.capFor('fence', T.houseLv(save.block)) - T.count(save.block, 'fence');
  $('hHintTxt').textContent = fenceMode === 'paint' ? (gl3d ? 'Drag to lay fence. ' : 'Tap to lay fence. ') + left + ' left.' : (gl3d ? 'Drag over fence to take it down.' : 'Tap fence to take it down.'); }
}
function homePaint(){ setBlock(save.block, 'home'); if (gl3d){ VIL.update(sceneFor(null)); VIL.select(homeSel); } else FB.scene(null); homeHud(); }
function setEdit(){ if (gl3d){ VIL.edit(fenceMode || 'move', HANDLERS); VIL.select(homeSel); } }
const HANDLERS = {
 movable:key => key === homeSel && !fenceMode,
 canPlace:(key, x, y) => { const it = item(key); return !!it && T.fitsAt(save.block, key, it.k, x, y); },
 place:(key, x, y) => moveTo(key, x, y),
 reject:() => toast("It doesn't fit there"),
 select:key => selectItem(key == null ? null : key, true),
 ring:key => { if (key !== homeSel) return 0; const it = item(key), d = it && T.BDEFS[it.k]; return d && d.range || 0; },
 paint:(x, y) => fenceAt(x, y, true), erase:(x, y) => fenceAt(x, y, false)
};
function selectItem(key, fromMap){
 if (!$('home').classList.contains('on')) return;
 homeSel = key && item(key) ? key : null; if (!fromMap && gl3d) VIL.select(homeSel);
 if (homeSel) openSheet('info'); else if (sheetKind === 'info') closeSheet();
}
function moveTo(key, x, y){ const it = item(key); if (!it) return; const ox = it.x, oy = it.y; it.x = x; it.y = y;

// a fence taken down gives back its 10 Supplies and half of what its levels cost
function fenceRefund(f){ let n = T.HOME.fence.cost[1]; for (let l = 1; l < (f.lv || 1); l++) n += Math.floor(T.upgradeCost('fence', l)[1] / 2); return n; }
function fenceAt(x, y, add){
 const b = save.block, i = b.findIndex(q => q.k === 'fence' && q.x === x && q.y === y);
 if (add){ if (i >= 0) return; const c = T.HOME.fence.cost;
  if (!T.fitsAt(b, null, 'fence', x, y)) return;
  if (T.count(b, 'fence') >= T.capFor('fence', T.houseLv(b))){ toast('No more fence at this house level'); return; }
  if (!has(c)){ toast('Fence costs ' + costText(c) + ' a piece'); return; }
  b.push({key:'f' + x + '_' + y, k:'fence', x, y, lv:1});
  if (!T.reachOk(b)){ b.pop(); toast('That would wall something in'); return; }
  pay(c); }
 else { if (i < 0) return; const back = fenceRefund(b[i]); b.splice(i, 1); addRes(0, back); }

function buy(k){

 const it = {key:'b' + (save.nk++), k, x:spot[0], y:spot[1], lv:1}; b.push(it);
 if (!T.reachOk(b)){ b.pop(); toast('No spot that leaves a way in. Move a fence first.'); return; }

}
// every fence piece at this one's level goes up one, if you can pay for all of them
function levelFences(key){ const it = item(key); if (!it || it.k !== 'fence' || it.lv >= T.houseLv(save.block)) return; const lv = it.lv || 1, list = save.block.filter(f => f.k === 'fence' && (f.lv || 1) === lv);

 pay(c); SND.fx('levelup'); list.forEach(f => f.lv = lv + 1); saveGame(); homePaint(); openSheet('info'); toast(list.length + ' pieces are ' + T.fenceName(lv + 1) + ' now'); }

// ---------- jobs, today's three, ranks, rounds (v0.6) ----------
function jobsDue(){ if (!save.block) return 0; const d = dayNow(); return T.jobsNow(save).filter(j => j && j.done).length + T.dailyNow(d).filter(t => t.done && !t.got).length + (rankOwed() ? 1 : 0); }
function rankOwed(){ const n = (save.rankPaid | 0) + 1; return n <= T.rankOf(save.rep) ? n : 0; }   // the next rank bonus not yet collected
function rankClaim(){ const n = rankOwed(); if (!n) return; const b = T.rankBonus(n); if (!roomFor(b)){ toast('Your stashes are too full to take this. Spend some first.'); return; }
 save.rankPaid = n; const g = addRes(b[0], b[1]); saveGame(); homeHud(); openSheet('jobs'); toast('+' + g.cash + ' Cash, +' + g.sup + ' Supplies'); }
function rankLine(){ const rk = T.rankOf(save.rep), nx = T.RANKS[rk + 1]; return nx ? ' ' + (nx[0] - save.rep) + ' Rep to ' + nx[1] + '.' : ''; }

function roomFor(c){ const cap = T.storeCap(save.block); return cap.cash - save.cash >= Math.min(c[0], cap.cash) && cap.sup - save.sup >= Math.min(c[1], cap.sup); }
function jobClaim(id){ const j = T.jobsNow(save).find(x => x && x.id === id); if (!j || !j.done) return;
 if (!roomFor(j.reward)){ toast('Your stashes are too full to take this. Spend some first.'); return; } SND.fx('cash');
 save.jobs[id] = 1; const g = addRes(j.reward[0], j.reward[1]); saveGame(); homeHud(); openSheet('jobs'); toast('+' + g.cash + ' Cash, +' + g.sup + ' Supplies'); }
function dailyClaim(slot){ const d = dayNow(), t = T.dailyNow(d)[slot]; if (!t || !t.done || t.got) return;
 const first = d.on !== d.d, pay = T.dailyPay(d.streak + (first ? 1 : 0)); if (!roomFor(pay)){ toast('Your stashes are too full to take this. Spend some first.'); return; }
 if (first){ d.streak = Math.min(99, d.streak + 1); d.on = d.d; } d.got[slot] = 1; const g = addRes(pay[0], pay[1]); saveGame(); homeHud(); openSheet('jobs'); toast('+' + g.cash + ' Cash, +' + g.sup + ' Supplies'); }
let runArmed = -1;
function runBack(ci){ if (!T.canRunBack(save.camp, save.rounds, ci)) return; const r = T.roundOf(save.rounds, ci) + 1;
 for (let bi = 0; bi < T.CAMP.blocks; bi++) delete save.camp[ci + '-' + bi]; save.rounds[ci] = r; saveGame(); openSheet('streets'); toast(T.CREWS[ci].name + ' are back for Round ' + r); }
function make(k){
 const it = T.ITEMS[k]; if (!it || !T.itemOpen(save.block, k)) return;

 const c = cv.getContext('2d'), star = (x, y, r, fill) => { c.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; c[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fillStyle = fill; c.fill(); c.lineWidth = px / 40; c.strokeStyle = '#7a5410'; c.stroke(); };
 if (kind === 'star') star(px / 2, px * .53, px * .4, '#f2b53a');
 else if (kind === 'star3'){ star(px * .25, px * .6, px * .2, '#f2b53a'); star(px * .75, px * .6, px * .2, '#f2b53a'); star(px * .5, px * .42, px * .26, '#f2b53a'); }
 else if (kind === 'moon'){ c.fillStyle = '#e8e2c8'; c.beginPath(); c.arc(px * .5, px * .5, px * .32, 0, 7); c.fill(); c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(px * .66, px * .4, px * .28, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; c.fillStyle = '#f2b53a'; [[.24, .2, .03], [.8, .74, .025], [.7, .16, .02]].forEach(([x, y, r]) => { c.beginPath(); c.arc(px * x, px * y, px * r, 0, 7); c.fill(); }); }
 return cv; }
// which picture goes with each job and daily job: 'b:<building>:<level>', 'f:<fighter>', 'h:<boss>', or a mark
const JOB_ICO = {s1:'star', s2:'star3', s3:'h:pops', s4:'star', s5:'moon', s6:'star', s7:'h:bigledger', s8:'star', s9:'star3', s10:'star', s11:'star', s12:'star',
 b1:'b:fence:1', b2:'b:house:2', b3:'b:store:1', b4:'b:porch:1', b5:'b:house:1', b6:'b:nail:1', b7:'b:house:3', b8:'b:light:1', b9:'b:fence:2', b10:'b:roof:1', b11:'b:house:4', b12:'b:rocket:1',
 c1:'f:brawler', c2:'b:gym:2', c3:'b:pad:1', c4:'b:workshop:1', c5:'h:enforcer', c6:'b:store:1', c7:'b:workshop:2', c8:'b:gym:4', c9:'star', c10:'b:workshop:3', c11:'b:gym:5', c12:'star'};
const DAILY_ICO = {fights:'f:brawler', stars:'star', three:'star3', night:'moon', pct:'b:house:1', moves:'h:enforcer', corner:'h:pops', home:'f:shooter', wins:'star'};
const PARTY_ICO = {watch:'b:light:1', cookout:'b:pad:1', mural:'b:studio:1'};
function anyIcon(spec, size){ const p = String(spec || 'star').split(':');
 if (p[0] === 'b') return bldIcon(p[1], +p[2] || 1, size);
 if (p[0] === 'f') return miniIcon(iconLook(p[1]), size);
 if (p[0] === 'h'){ const tmp = document.createElement('div'); tmp.innerHTML = face(p[1]); const im = tmp.firstChild; if (im){ im.style.width = im.style.height = size + 'px'; } return im || markIcon('star', size); }
 return markIcon(p[0], size); }
// cost as money marks instead of words, for the menus
const costChips = c => !c ? '' : (c[0] ? '<span class="cost"><i class="ic cash"></i>' + c[0] + '</span>' : '') + (c[1] ? '<span class="cost"><i class="ic sup"></i>' + c[1] + '</span>' : '') || 'Free';
// The coach: a first-run guide. It reads what the player is looking at and moves on only when they have done the thing. save.guide: 0 to 5 are the steps, 99 is off.
const COACH = {
 crew0:['Start with your crew. Tap Crew.', 'hCrew'],
 crew1:['Tap a fighter to hire one. They cost Cash and sleep in your Crash Pad. Fill the beds, then close this.'],
 go0:['Crew is ready. Tap Attack to see the streets.', 'hAttack'],
 go1:['Six crews hold these streets. Tap block 1 to start a fight.'],
 f0:['Tap a fighter card at the bottom, then tap the street outside the fence. Every tap sends one in.'],
 f1:['They pick their own targets. Send the rest in. Half the block is one star, the Main House is two, everything is three.'],
 res:['Stars open the next block. Whoever is still standing walks home, and the loot is in your stashes.'],
 spend:['Spend the loot. Tap Build for new buildings, or tap any building to level it up. Jobs pays extra.', 'hBuild']};
let coachKey = null;
function coach(){ const el = $('coach'); let g = save.guide, key = null;
 if (g !== 99 && save.rescued && save.block && $('intro').hidden){
  const scr = ['hud', 'result', 'home'].find(k => $(k).classList.contains('on')), sent = scr === 'hud' && sim && R && R.attackers.some((a, i) => queued[i] || sim.placed(i));
  if (g === 0 && scr === 'home' && sheetKind === 'crew') g = 1;
  if (g === 1 && scr === 'home' && sheetKind !== 'crew' && T.armySize(save.army) > 0) g = 2;
  if (g <= 2 && scr === 'hud') g = 3;
  if (g === 3 && scr === 'result') g = 4;
  if (g === 4 && scr === 'home') g = 5;
  if (g === 5 && scr === 'home' && sheetKind && sheetKind !== 'streets') g = 99;
  if (g !== save.guide){ save.guide = g; saveGame(); }
  if (scr === 'home') key = g === 0 ? 'crew0' : g === 1 ? (sheetKind === 'crew' ? 'crew1' : 'crew0') : g === 2 ? (sheetKind === 'streets' ? 'go1' : sheetKind ? null : 'go0') : g === 5 && !sheetKind ? 'spend' : null;
  else if (scr === 'hud' && g === 3) key = sent ? 'f1' : 'f0';
  else if (scr === 'result' && g === 4) key = 'res'; }
 document.body.classList.toggle('coaching', !!key);
 // portrait with a sheet open: sit just above the sheet, never on it
 { let top = ''; if (key && sheetKind && !$('sheet').hidden && innerHeight > innerWidth){ const st = $('sheet').getBoundingClientRect().top, h = el.offsetHeight || 80; if (st - h - 8 < 150) top = Math.max(4, st - h - 8) + 'px'; } if (el.style.top !== top) el.style.top = top; }
 if (key === coachKey) return; coachKey = key; el.hidden = !key || key === 'res';   // on the result screen the tip sits inside the panel, under the numbers
 $('resTip').hidden = key !== 'res'; if (key === 'res') $('resTip').textContent = COACH.res[0]; document.querySelectorAll('.hintme').forEach(n => n.classList.remove('hintme'));
 if (key){ $('coachTxt').textContent = COACH[key][0]; if (COACH[key][1]) $(COACH[key][1]).classList.add('hintme'); } }
$('coachOff').onclick = () => { save.guide = 99; saveGame(); coach(); toast('Tips are off. Turn them back on from Jobs.'); };
setInterval(coach, 350);
function hit(ci, bi){
 if (!T.armySize(save.army)){ toast('Train a crew first'); openSheet('crew'); return; }
 if (ci >= 0 && !T.campOpen(save.camp, save.block, ci, bi, save.rounds)){ toast(T.houseLv(save.block || []) < T.CREWS[ci].hl ? 'Opens at Main House level ' + T.CREWS[ci].hl : 'Get a star on the block before it first'); return; }
 closeSheet();
 if (ci < 0){ startAttack(T.raidRecipe(seed(), save.army, save.research, myLoad(true))); return; }
 startAttack(T.campRecipe(ci, bi, seed(), save.army, save.research, save.night, myLoad(false, ci))); }
// what you bring besides fighters: your bosses and every item you have made
// the Boombox corner is your crew's loot run: bosses sit that one out (it never runs dry, so they would farm it for free)
function myLoad(corner, ci){ return {bosses:corner ? [] : T.BOSS_ORDER, kit:Object.assign({}, save.kit), hl:T.houseLv(save.block || []), round:ci >= 0 ? T.roundOf(save.rounds, ci) : 1}; }
// the flat map has no dragging: tap a building to pick it, then tap an open spot to move it there
function homeGround(gx, gy){
 const x = Math.floor(gx), y = Math.floor(gy);
 if (fenceMode){ fenceAt(x, y, fenceMode === 'paint'); return; }
 const p = PARTS.find(q => x >= q.x && x < q.x + q.fw && y >= q.y && y < q.y + q.fh);
 if (p){ selectItem(p.key); FB.scene(null); return; }
 const it = item(homeSel); if (it && T.fitsAt(save.block, it.key, it.k, x, y)){ moveTo(it.key, x, y); return; }
 selectItem(null);
}
// slide the camera so a spot on the lot sits clear of the sheet
function focusOn(x, y){ if (!gl3d) return; const v = VIL.view(), r = $('stage').getBoundingClientRect(), tall = r.width < r.height;
 const p = VIL.project(x, y, 0), a = VIL.project(x + 1, y, 0), b = VIL.project(x, y + 1, 0); if (!p || !a || !b) return;
 const ex = p[0] - (tall ? r.width * .5 : r.width * .27), ey = p[1] - (tall ? r.height * .36 : r.height * .5);
 const j11 = a[0] - p[0], j21 = a[1] - p[1], j12 = b[0] - p[0], j22 = b[1] - p[1], det = j11 * j22 - j12 * j21; if (!det) return;
 VIL.view({tx:v.tx + (j22 * ex - j12 * ey) / det, ty:v.ty + (-j21 * ex + j11 * ey) / det, zoom:v.zoom}); }
function toHome(){
 if (!save.block){ save.block = T.starterBlock(); save.cash = T.START.cash; save.sup = T.START.sup; save.army = Object.assign({}, T.START.army); save.nk = 20; saveGame(); firstHome = true; }
 if (gl3d) VIL.battle(null); lightFor(null); homeSel = null; fenceMode = null; closeSheet(); show('home'); homePaint(); setEdit(); cam('home');
 // never stuck: with nobody left and no money to train anyone, the Viceroy sends a few Brawlers over
 if (!T.armySize(save.army) && save.cash < T.trainCost('brawler') * 4){ save.army.brawler = Math.min(6, T.armyCap(save.block)); saveGame(); setTimeout(() => toast('The Viceroy sent ' + save.army.brawler + ' Brawlers over. On the house.', 3000), 600); }
 homeHud(); netSync(false); if (MY_CREW !== 'lav') setTimeout(() => Object.keys(MY_BOSS).forEach(k => tintFace(k, MY_CREW)), 1500);
 if (firstHome){ firstHome = false; openSheet('crew'); }
}

// ---------- updates: a new build on the server prompts a reload ----------
function checkUpdate(){
 fetch('sw.js', {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/turf-v([\d.]+)/); if (m && m[1] !== VER){ toast('New version ' + m[1] + ', tap to reload', 12000, () => location.reload()); if ('serviceWorker' in navigator) swUpdate(); } }).catch(() => {});
}
function bust(){
 // the version buster: if the page on the server is newer than this copy, load it once
 try { if (sessionStorage.getItem('turf.bust') === VER) return; } catch (e){}
 fetch(location.pathname, {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/<meta name="build" content="([^"]+)"/);
  if (m && m[1] !== VER){ try { sessionStorage.setItem('turf.bust', VER); } catch (e){} location.replace(location.pathname + '?v=' + m[1]); } }).catch(() => {});
}
// ask the browser to look for a newer service worker now, not whenever it gets around to it
function swUpdate(){ try { navigator.serviceWorker.getRegistration().then(r => { if (r) r.update().catch(() => {}); }).catch(() => {}); } catch (e){} }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').then(swUpdate).catch(() => {});
if (location.protocol.startsWith('http')){ bust(); checkUpdate(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); }); }

// ---------- go ----------
mountMap();
// a brand new player sees the intro once, before the title; after that it is a button on the title
if (!introSeen() && !save.rescued && !save.tries) introPlay(); else introFind(list => { $('introBtn').hidden = !list.length; });
{ const done = settlePending(); toTitle(); if (done) setTimeout(() => toast('Your last fight played out while you were away: ' + done.stars + (done.stars === 1 ? ' star' : ' stars'), 3200), 900); }
// test hook (used by the headless proof): read-only peeks at the fight
window.TURF_TEST = {bld:(k, lv, n) => bldIcon(k, lv, n), tint:(k, color) => Promise.resolve(tintFace(k, color)), net:() => ({code:save.crewCode, list:crewList, msg:netMsg, busy:netBusy}), pvpTest:(p, listOnly) => { crewList = [p]; if (!listOnly) hitPlayer(p.uid); }, block:() => JSON.parse(JSON.stringify(save.block)), home:() => ({cash:save.cash, sup:save.sup, army:Object.assign({}, save.army), sel:homeSel, sheet:sheetKind, fence:fenceMode, color:MY_CREW, lv:save.block ? T.houseLv(save.block) : 0, n:save.block ? save.block.length : 0}),
 state:() => ({screen:['title', 'story', 'hud', 'result', 'watch', 'home'].find(k => $(k).classList.contains('on')), tick:sim ? sim.tick() : 0, counts:Object.assign({}, counts), sel, finished, gl3d, reports:save.reports.length}),
 camp:() => JSON.parse(JSON.stringify({camp:save.camp, night:save.night})), hit, intro:() => ({on:!$('intro').hidden, at:introAt, shots:introList.map(s => s.n), video:introVidOn}), icon:(l, n) => miniIcon(l, n), select:k => { selectItem(k, true); openSheet('info'); },
 toScreen:(x, y, z) => gl3d ? VIL.project(x, y, z || 0) : null, result:() => sim ? sim.result() : null};
})();
